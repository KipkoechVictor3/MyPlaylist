name: Playlist Update

on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

jobs:
  run-wfty-script:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies 🛠️
        run: |
          # Ensures venv is available and dependencies are installed
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 aiohttp httpx requests beautifulsoup4 python-dateutil
        shell: bash

      - name: Download WFTY.py from Dropbox
        run: |
          curl -L -o WFTY.py "https://tinyurl.com/4kvwzwcc"
        shell: bash

      - name: Run WFTY.py ⏱️
        run: |
          source venv/bin/activate
          echo "::group::▶️ Running WFTY.py (Football & Racing)..."
          START_TIME=$(date +%s)
          
          python -u WFTY.py
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Time Complete::**✅ WFTY.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # Check for the single output file
          if [ ! -f "Footy.m3u8" ]; then
              echo "⚠️ Expected output Footy.m3u8 not found!"
          fi
        shell: bash

      - name: Upload Footy.m3u8 to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: Footy.m3u8 # Single source file
          DEST_PATH: /MyStuff/Footy.m3u8 # Single destination file
