name: BTV Playlist Updater

on:
  # Runs every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  # Allows manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  run-playlist-script:
    runs-on: ubuntu-latest
    container:
      # Using a slim Python image
      image: python:3.11-slim 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Install curl and Python dependencies ---
      - name: Install System and Python Dependencies
        run: |
          # 1. Update package lists and install curl
          apt-get update
          apt-get install -y curl 
          
          # 2. Install necessary Python package
          pip install requests
        shell: bash
        
      # --- Download Script (Now curl will work) ---
      - name: Download BTV Script
        run: |
          # Downloads the external script and names it Bytvv.py
          curl -L -o Bytvv.py "https://bit.ly/4qwxVRA"
        shell: bash

      # --- Run Script and Rename Output ---
      - name: Run Bytvv.py and Measure Time ⏱️
        run: |
          
          echo "::group::▶️ Running Bytvv.py..."
          START_TIME=$(date +%s)
          
          # Run the downloaded script
          python Bytvv.py
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"

          echo "::notice title=Script Time Complete::**✅ Bytvv.py FINISHED!** Time Taken: **${DURATION} seconds**"
          
          # Renames the output file to 'bytvv.m3u' if the script output 'S1.m3u'
          if [ ! -f "bytvv.m3u" ]; then
              # This line assumes the script outputs 'S1.m3u' if 'bytvv.m3u' isn't found
              mv S1.m3u bytvv.m3u || echo "⚠️ Could not find expected output file (S1.m3u or bytvv.m3u)."
          fi
        shell: bash

      # --- Upload to Dropbox ---
      - name: Upload bytvv.m3u to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: bytvv.m3u
          DEST_PATH: /MyStuff/bytvv.m3u
