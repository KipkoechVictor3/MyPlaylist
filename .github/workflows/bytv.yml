name: bytv script

on:
  # Runs every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-fsc-script:
    runs-on: ubuntu-latest
    container:
      # Using the known-working Playwright image
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup and Install Dependencies ---
      - name: Setup Environment and Install Dependencies
        run: |
          echo "Installing system packages and creating venv..."
          apt-get update
          # Install necessary system packages
          apt-get install -y python3-venv curl
          
          # Create and activate a virtual environment for reliable package access
          python3 -m venv venv
          source venv/bin/activate
          
          # Upgrade pip and install Python dependencies (only requests needed)
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      # --- Download BYTV Script ---
      - name: Download BYTV Script
        run: |
          # Curl is now installed in the previous step
          curl -L -o Bytvv.py "https://bit.ly/4qwxVRA"
        shell: bash

      # --- Run Bytvv.py and Measure Time ⏱️ (Using venv for reliability) ---
      - name: Run Bytvv.py and Measure Time ⏱️
        run: |
          # Re-activate venv for this run step
          source venv/bin/activate
          
          echo "::group::▶️ Running Bytvv.py..."
          START_TIME=$(date +%s)
          
          # Run the script
          python Bytvv.py
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"

          echo "::notice title=Script Time Complete::**✅ Bytvv.py FINISHED!** Time Taken: **${DURATION} seconds**"
          
          # Check for output file
          if [ ! -f "bytvv.m3u" ]; then
              if [ -f "S1.m3u" ]; then
                  mv S1.m3u bytvv.m3u
                  echo "File S1.m3u found and renamed to bytvv.m3u."
              else
                  echo "❌ FATAL ERROR: Bytvv.py finished in ${DURATION} seconds but created no output file (S1.m3u or bytvv.m3u)."
                  # Fail the step if no file is found (exit code 1)
                  exit 1 
              fi
          fi
        shell: bash

      # --- Upload bytvv.m3u to Dropbox ---
      - name: Upload bytvv.m3u to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: bytvv.m3u
          DEST_PATH: /MyStuff/bytvv.m3u
