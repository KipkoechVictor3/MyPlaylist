name: BTV Playlist Updater

on:
  # Runs every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  # Allows manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  run-playlist-script:
    # Use a standard, slim Python image for faster execution
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim # Switched from Playwright image
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Dependency Installation ---
      - name: Install necessary Python dependencies
        # Only install 'requests' since the script is external and likely lightweight
        run: pip install requests
        shell: bash
        
      # --- Download Script ---
      - name: Download BTV Script
        run: |
          # Downloads the external script and names it Bytvv.py
          curl -L -o Bytvv.py "https://bit.ly/4qwxVRA"
        shell: bash

      # --- Run Script and Rename Output ---
      - name: Run Bytvv.py and Measure Time ⏱️
        run: |
          
          echo "::group::▶️ Running Bytvv.py..."
          START_TIME=$(date +%s)
          
          # Run the downloaded script
          python Bytvv.py
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"

          echo "::notice title=Script Time Complete::**✅ Bytvv.py FINISHED!** Time Taken: **${DURATION} seconds**"
          
          # Renames the output file to 'bytvv.m3u' if the script output 'S1.m3u'
          if [ ! -f "bytvv.m3u" ]; then
              # NOTE: You MUST confirm what the Bytvv.py script outputs! 
              # If it outputs something else (e.g., modified_playlist.m3u8), change 'S1.m3u' below.
              mv S1.m3u bytvv.m3u || echo "⚠️ Could not find expected output file. Upload may fail."
          fi
        shell: bash

      # --- Upload to Dropbox ---
      - name: Upload bytvv.m3u to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: bytvv.m3u
          DEST_PATH: /MyStuff/bytvv.m3u
