name: Strcrn M3U Playlist Update

on:
  schedule:
    # Runs at the 30-minute mark of every hour (e.g., 01:30, 02:30, etc.)
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  update-streC-playlist:
    runs-on: ubuntu-latest

    # Use the Playwright image which includes Python and browser dependencies
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble

    env:
      HOME: /root

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # Prevent the Docker config permission warning by ensuring the file exists with safe perms.
      - name: 🔧 Ensure /root/.docker/config.json exists (silence permission warnings)
        run: |
          mkdir -p /root/.docker
          if [ ! -f /root/.docker/config.json ]; then
            echo "{}" > /root/.docker/config.json
            chmod 600 /root/.docker/config.json
          fi
        shell: bash

      # --- Setup & Dependencies ---
      - name: 🐍 Create venv and install Python dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3-venv python3-dev build-essential
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          # Install the libraries your script requires (bs4 -> beautifulsoup4, plus lxml and requests)
          python -m pip install "playwright==1.55.0" "beautifulsoup4" "lxml" "requests" "aiohttp"
          # Ensure Playwright browser binaries are installed for the venv-installed CLI.
          # --with-deps is helpful inside many container setups; if it fails, try `playwright install`.
          python -m playwright install --with-deps || python -m playwright install
        shell: bash

      # --- Script Download ---
      - name: 📥 Download StrmCrnr.py
        run: |
          curl -fsSL -o StrmCrnr.py "https://www.dropbox.com/scl/fi/j5yqpq4qczuum4gskoz7j/StrmCrnr.py?rlkey=rl1kd87vgqm62rswja6sqg37a&st=jkbhj394&dl=1"
        shell: bash

      # --- Run Script ---
      - name: 🏃 Run StrmCrnr.py ⏱️
        run: |
          set -euo pipefail
          source venv/bin/activate
          echo "::group::▶️ Running StrmCrnr.py..."
          START_TIME=$(date +%s)
          # Unbuffered mode for real-time logs
          python -u StrmCrnr.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Time Complete::✅ StrmCrnr.py FINISHED! Time Taken: ${DURATION} seconds"
          # Verify the expected output file
          if [ ! -f "StrmCrnr.m3u" ]; then
              echo "⚠️ Expected output file 'StrmCrnr.m3u' not found! Check script logs."
              exit 1
          fi
        shell: bash

      # --- Upload to Dropbox ---
      - name: 📤 Upload M3U Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: StrmCrnr.m3u
          DEST_PATH: /Playlists/StrmCrnyryr.m3u
