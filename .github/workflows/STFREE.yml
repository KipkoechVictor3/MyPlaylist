name: StreamFree Scraper Workflow

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch: 

jobs:
  update-stfree-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install cloudflare-warp -y
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          
          echo "Waiting for WARP to verify connection..."
          for i in {1..12}; do
            if warp-cli status | grep -q "Connected"; then
              echo "WARP is fully connected."
              break
            fi
            echo "Waiting... (Attempt $i)"
            sleep 5
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2,socks] socksio

      - name: Run StreamFree Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          curl -L -f -o stfree.py "${{ secrets.STRFREE_URL }}"
          # Ensure the script starts with the latest code
          python -u stfree.py || echo "⚠️ Scraper execution had issues..."

      - name: Deploy Generated M3U to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stfree.m3u || echo "No m3u file found"
          git commit -m "Update StreamFree: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"

      - name: Upload to Dropbox
        if: hashFiles('stfree.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: stfree.m3u
          dest_path: /MyStuff/stfree.m3u
