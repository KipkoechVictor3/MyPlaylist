name: StreamFree Scraper (Tailscale Tunnel)

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch: 

jobs:
  update-stfree-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Uses your Kenyan home IP for all requests
          args: --exit-node=${{ secrets.HOME_PC_IP }} --exit-node-allow-lan-access=false
          ping: ${{ secrets.HOME_PC_IP }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2]

      - name: Run StreamFree Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          curl -L -f -o stfree.py "${{ secrets.STRFREE_URL }}"
          python -u stfree.py

      - name: Deploy Generated M3U to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stfree.m3u || echo "No m3u file found"
          git commit -m "Update StreamFree: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push origin main || echo "Push failed"

      - name: Upload to Dropbox
        if: hashFiles('stfree.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: stfree.m3u
          dest_path: /MyStuff/stfree.m3u
