name: StreamFree Scraper Workflow

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch: 

jobs:
  update-stfree-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install cloudflare-warp -y
          
          # Start the background daemon explicitly
          sudo systemctl enable --now warp-svc
          sleep 2
          
          # Registration and setup
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos connect
          
          echo "Waiting for WARP tunnel stabilization..."
          for i in {1..15}; do
            STATUS=$(sudo warp-cli --accept-tos status)
            echo "$STATUS"
            if [[ "$STATUS" == *"Connected"* ]]; then
              echo "WARP is ready!"
              break
            fi
            sleep 5
          done
          # Final network test
          curl --socks5-hostname 127.0.0.1:4000 -I https://google.com || echo "Proxy still not routing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2,socks] socksio

      - name: Run StreamFree Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          curl -L -f -o stfree.py "${{ secrets.STRFREE_URL }}"
          python -u stfree.py || echo "⚠️ Scraper execution had issues..."

      - name: Deploy Generated M3U to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stfree.m3u || echo "No m3u file found"
          git commit -m "Update StreamFree: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push origin main || echo "Push failed"

      - name: Upload to Dropbox
        if: hashFiles('stfree.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: stfree.m3u
          dest_path: /MyStuff/stfree.m3u
