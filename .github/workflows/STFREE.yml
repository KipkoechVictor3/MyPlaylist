name: StreamFree Scraper Workflow

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch: 

concurrency:
  group: stfree-processing
  cancel-in-progress: true

jobs:
  update-stfree-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      PYTHONUNBUFFERED: "1"
      HOME: /root
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment and Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pip python3-full curl xvfb git
          python3 -m pip install httpx[http2] aiohttp h2 requests beautifulsoup4 playwright --break-system-packages
          playwright install chromium firefox
          playwright install-deps

      - name: Run StreamFree Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running StreamFree Scraper ---"
          # Download the script from your secret URL
          curl -L -f -o stfree.py "${{ secrets.STRFREE_URL }}"
          
          # Execute the script
          # Using xvfb-run in case your specific script version uses Playwright's headed mode or browser hooks
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u stfree.py || echo "⚠️ StreamFree failed..."
          sync

      - name: Deploy Generated M3U to GitHub
        shell: bash
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git add stfree.m3u || echo "No stfree.m3u found"
          git commit -m "Update StreamFree playlist: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          
          git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)

      - name: Upload to Dropbox
        if: hashFiles('stfree.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: stfree.m3u
          dest_path: /MyStuff/stfree.m3u
