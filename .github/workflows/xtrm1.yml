name: Scraper Script # Updated workflow name

on:
  # Runs once every 24 hours at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual runs too
  workflow_dispatch:

jobs:
  run-media4u-script:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          # The script requires 'requests' and 'tqdm' (though tqdm is optional)
          pip install requests tqdm
        shell: bash

      - name: Download Xtreme Downloader script
        run: |
          echo "📥 Downloading xtremeDowbloader.py from Dropbox..."
          # NOTE: The provided Python script saves the output as 'MyPlaylistMark.m3u'
          curl -L -o xtremeDowbloader.py "https://www.dropbox.com/scl/fi/392dx1gx08yfy41a3vm0y/xtremeDowbloader.py?rlkey=nm8uwltes5c4pl0maa8ju0atx&st=xr8l0kks&dl=1"
        shell: bash

      - name: Run Scraper and Measure Time ⏱️
        run: |
          source venv/bin/activate
          
          echo "::group::▶️ Running xtremeDowbloader.py..."
          START_TIME=$(date +%s)

          # Execute the downloaded script
          python xtremeDowbloader.py

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Time Complete::**✅ Script FINISHED!** Time Taken: **${DURATION} seconds**"

          # Rename output (MyPlaylistMark.m3u) to MyPLaay.m3u
          if [ -f "MyPlaylistMark.m3u" ]; then
              mv MyPlaylistMark.m3u MyPLaay.m3u
              echo "✅ Renamed MyPlaylistMark.m3u to MyPLaay.m3u"
          else
              echo "⚠️ Expected output file **MyPlaylistMark.m3u** not found."
          fi
        shell: bash

      - name: Upload MyPLaay.m3u to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyPLaay.m3u # Source is the newly renamed file
          DEST_PATH: /MyStuff/MyPLaay.m3u # Destination is the desired path and name
