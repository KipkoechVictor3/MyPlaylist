name: Fscript

on:
  # Runs every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-fsc-script:
    runs-on: ubuntu-latest
    container:
      # Using the known-working Playwright image
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup and Install Dependencies ---
      - name: Setup Environment and Install Dependencies
        run: |
          echo "Installing system packages and creating venv..."
          apt-get update
          # Install necessary system packages
          apt-get install -y python3-venv curl
          
          # Create and activate a virtual environment for reliable package access
          python3 -m venv venv
          source venv/bin/activate
          
          # Upgrade pip and install Python dependencies (only requests needed)
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      # --- Download FTS Script (Updated URL) ---
      - name: Download FTS Script
        run: |
          # Downloading the script that processes the FTS playlist
          # NOTE: We assume the script at this link contains the dynamic grouping logic.
          curl -L -o FTS_processor.py "https://tinyurl.com/4kmk7xrm"
        shell: bash

      # --- Run FTS_processor.py and Measure Time ⏱️ ---
      - name: Run FTS Processor and Measure Time ⏱️
        run: |
          # Re-activate venv for this run step
          source venv/bin/activate
          
          OUTPUT_FILE="filtered_FTS_playlist.m3u8"
          
          echo "::group::▶️ Running FTS_processor.py..."
          START_TIME=$(date +%s)
          
          # Run the script
          python FTS_processor.py
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"

          echo "::notice title=Script Time Complete::**✅ FTS Processor FINISHED!** Time Taken: **${DURATION} seconds**"
          
          # Check for the expected output file: filtered_FTS_playlist.m3u8
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ FATAL ERROR: Script finished in ${DURATION} seconds but created no output file ($OUTPUT_FILE)."
            # Fail the step if no file is found (exit code 1)
            exit 1 
          fi
        shell: bash

      # --- Upload filtered_FTS_playlist.m3u8 to Dropbox ---
      - name: Upload filtered_FTS_playlist.m3u8 to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: filtered_FTS_playlist.m3u8
          DEST_PATH: /MyStuff/filtered_FTS_playlist.m3u8
