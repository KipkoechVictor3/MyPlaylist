name: SS99 Playlist Updater

on:
  workflow_dispatch:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'

jobs:
  update-ss99-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0 requests
          
          # Install Firefox as per preference
          python -m playwright install firefox
        shell: bash

      - name: Download SS99 Scraper
        run: |
          curl -L -o "$GITHUB_WORKSPACE/SS99_Scraper.py" "https://www.dropbox.com/scl/fi/o0mxw7v6gfm9eftonscuy/str99.py?rlkey=ehs3jfw6kdig0hgp4a8fb2fit&st=38etoi0k&dl=1"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          python SS99_Scraper.py 
        shell: bash

      - name: Verify File Generation
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f "SSpo99.m3u8" ]; then
            echo "✅ Playlist SSpo99.m3u8 successfully generated."
            ls -lh SSpo99.m3u8
          else
            echo "❌ ERROR: SSpo99.m3u8 was not created!"
            ls -R
            exit 1
          fi
        shell: bash

      - name: Upload Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SSpo99.m3u8 
          DEST_PATH: /MyStuff/SSpo99.m3u8
