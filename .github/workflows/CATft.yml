name: Scraper Script CATFT

on:
  # Runs every 3 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual runs too
  workflow_dispatch:

jobs:
  run-blucast-script:
    runs-on: ubuntu-latest
    container:
      # Using Playwright container as requested, ensuring Firefox compatibility
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies (requests)..."
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Download BluCast Script
        run: |
          echo "📥 Downloading CATFt.py from Dropbox..."
          # Link updated to CATFt.py
          curl -L -o CATFt.py "https://www.dropbox.com/scl/fi/wf74ev50wjskahwifmzcp/CATFt.py?rlkey=yl569ajzo11dgnblpwf6wd11i&st=7fes2iic&dl=1"
        shell: bash

      - name: Run Scraper and Verify Output ⏱️
        run: |
          source venv/bin/activate
          
          echo "::group::▶️ Running CATFt.py..."
          START_TIME=$(date +%s)
          python CATFt.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Complete::**✅ CATFt.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # 🚨 CRITICAL CHECK: Verify the specific output file from our script
          if [ -f "Combined_Sports.m3u" ]; then
              echo "✅ Output file **Combined_Sports.m3u** found."
          else
              echo "❌ Expected output file **Combined_Sports.m3u** not found."
              ls -R # Diagnostic: list all files to see what was actually created
              exit 1 
          fi
        shell: bash

      - name: Upload Modified Playlist to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "Combined_Sports.m3u"
          DEST_PATH: /MyStuff/Combined_Sports.m3u
