name: Scraper Script CATFt

on:
  # Runs every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  # Allow manual runs too
  workflow_dispatch:

jobs:
  run-catft-script:
    runs-on: ubuntu-latest
    # Using a standard python image since CATFt.py doesn't require Firefox/Playwright
    container:
      image: python:3.11-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies (requests)..."
          apt-get update && apt-get install -y curl
          pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Download CATFt Script
        run: |
          echo "📥 Downloading CATFt.py from Dropbox..."
          curl -L -o CATFt.py "https://www.dropbox.com/scl/fi/wf74ev50wjskahwifmzcp/CATFt.py?rlkey=yl569ajzo11dgnblpwf6wd11i&st=7fes2iic&dl=1"
        shell: bash

      - name: Run Scraper and Verify Output ⏱️
        run: |
          echo "::group::▶️ Running CATFt.py..."
          START_TIME=$(date +%s)
          python CATFt.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Complete::**✅ CATFt.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # Verify the specific output file defined in your script: Combined_Sports.m3u
          if [ -f "Combined_Sports.m3u" ]; then
              echo "✅ Output file **Combined_Sports.m3u** found."
          else
              echo "❌ Expected output file **Combined_Sports.m3u** not found."
              ls -R # Diagnostic
              exit 1 
          fi
        shell: bash

      - name: Upload Combined Sports Playlist to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@v1.0.0
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "Combined_Sports.m3u"
          dest_path: "/MyStuff/Combined_Sports.m3u"
