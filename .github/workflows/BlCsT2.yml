name: Scraper Script BluCast

on:
  # Runs every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  # Allow manual runs too
  workflow_dispatch:

jobs:
  run-blucast-script:
    runs-on: ubuntu-latest
    container:
      # Using Playwright container as requested, ensuring Firefox compatibility
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies (requests)..."
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Download BluCast Script
        run: |
          echo "📥 Downloading BluCast.py from Dropbox..."
          # Replace the URL below with your actual BluCast.py Dropbox link
          curl -L -o BluCast.py "https://www.dropbox.com/scl/fi/g15qgpv5e08bi6ydabyd0/BluCast2.py?rlkey=kgm0pt7kms85jy9ul1sowfd00&st=3vo17egp&dl=1"
        shell: bash

      - name: Run Scraper and Verify Output ⏱️
        run: |
          source venv/bin/activate
          
          echo "::group::▶️ Running BluCast.py..."
          START_TIME=$(date +%s)
          python BluCast.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Complete::**✅ BluCast.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # 🚨 CRITICAL CHECK: Verify the specific output file from your script
          if [ -f "Modified Playlist Blucast2.m3u" ]; then
              echo "✅ Output file **Modified Playlist Blucast2.m3u** found."
          else
              echo "❌ Expected output file **Modified Playlist Blucast2.m3u** not found."
              ls -R # Diagnostic: list all files to see what was actually created
              exit 1 
          fi
        shell: bash

      - name: Upload Modified Playlist to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "Modified Playlist Blucast2.m3u"
          DEST_PATH: /MyStuff/Modified Playlist Blucast2.m3u
