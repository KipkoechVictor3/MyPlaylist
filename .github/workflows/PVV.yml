name: PPL Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/35 * * * *'

jobs:
  update-tml-playlist:
    runs-on: ubuntu-latest
    container:
      # Using the Noble version of Playwright's official image
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          # Use python -m pip to ensure it's in the venv
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0 httpx aiohttp dropbox requests
          
          # FIX: Call playwright as a python module
          python -m playwright install firefox
        shell: bash

      - name: Download PPL Scraper
        run: |
          curl -L -o "$GITHUB_WORKSPACE/PPL_Scraper.py" "https://www.dropbox.com/scl/fi/kwnyqfprxbc3ds7gsvcaz/PPL_SCRIPTProxied.py?rlkey=dzlolascl09fzlqhvqqh9im5c&st=sfizkeb7&dl=1"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          # Running the downloaded script
          python PPL_Scraper.py 
        shell: bash

      - name: Verify File Generation
        run: |
          cd "$GITHUB_WORKSPACE"
          # Your script generates S3.m3u and S3_Proxied.m3u
          if [ -f "S3.m3u" ] && [ -f "S3_Proxied.m3u" ]; then
            echo "✅ Both playlists successfully generated."
            ls -lh S3.m3u S3_Proxied.m3u
          else
            echo "❌ ERROR: Playlists were not created!"
            ls -R
            exit 1
          fi
        shell: bash

      - name: Upload Standard Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S3.m3u 
          DEST_PATH: /MyStuff/S3.m3u

      - name: Upload Proxied Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S3_Proxied.m3u 
          DEST_PATH: /MyStuff/S3_Proxied.m3u
