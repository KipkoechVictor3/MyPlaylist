name: Scraper Script VPNGN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-magroup-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper Directly
        run: |
          # Download and run in a single command without creating a permanent file
          curl -L "https://www.dropbox.com/scl/fi/4c2i95nllxw75e39bsdw9/kilatliveNet.py?rlkey=turn2i3ixkcga0patdu1duarv&st=ujjz3vl1&dl=1" | python3

      - name: Upload knnn.m3u to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "knnn.m3u"
          dest_path: "/MyStuff/knnn.m3u"
