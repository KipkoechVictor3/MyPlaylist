name: Scraper Script MAgroup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-magroup-script:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          pip install requests
        shell: bash

      - name: Download and Run Script
        run: |
          curl -L -o MAgroup.py "https://www.dropbox.com/scl/fi/k2pmkb9rhb05lvf14d1hr/MAgroup.py?rlkey=w8n9yo3wjyamjefr8xttntrw6&st=tdx54yeh&dl=1"
          source venv/bin/activate
          python -u MAgroup.py
        shell: bash

      - name: Upload Main M3Us & Links List
        # This handles individual files (works with your current action)
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          # We upload three files. The action allows one per step or a list. 
          # To be safe, we'll repeat for the new dropbox file.
          source_path: "macg.m3u"
          DEST_PATH: "/MyStuff/macg.m3u"

      - name: Upload Master Dropbox M3U
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "macg_dropbox.m3u"
          DEST_PATH: "/MyStuff/macg_dropbox.m3u"

      - name: Upload Bridge Folder Contents Individually
        # Since the Action fails on directories, we loop and upload files one by one.
        # Note: We use curl here to ensure directory structure is respected.
        run: |
          # Get a temporary access token using your refresh token
          TOKEN=$(curl -s -X POST https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }} \
            -u ${{ secrets.DROPBOX_APP_KEY }}:${{ secrets.DROPBOX_APP_SECRET }} | jq -r .access_token)

          for file in MacG/*.m3u8; do
            fname=$(basename "$file")
            echo "Uploading $fname..."
            curl -X POST https://content.dropboxapi.com/2/files/upload \
              --header "Authorization: Bearer $TOKEN" \
              --header "Dropbox-API-Arg: {\"path\": \"/MyStuff/MacG/$fname\",\"mode\": \"overwrite\"}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary @"$file"
          done
        shell: bash
