name: Scraper Script MAgroup

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-magroup-script:
    runs-on: ubuntu-latest
    container:
      # Using Playwright container for Firefox-readiness
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests
        shell: bash

      - name: Download MAgroup Script
        run: |
          echo "📥 Downloading MAgroup.py from Dropbox..."
          curl -L -o MAgroup.py "https://www.dropbox.com/scl/fi/k2pmkb9rhb05lvf14d1hr/MAgroup.py?rlkey=w8n9yo3wjyamjefr8xttntrw6&st=tdx54yeh&dl=1"
        shell: bash

      - name: Run Scraper and Verify Output ⏱️
        run: |
          source venv/bin/activate
          
          echo "::group::▶️ Running MAgroup.py..."
          START_TIME=$(date +%s)
          # Unbuffered output to see progress in real-time
          python -u MAgroup.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          
          echo "::notice title=Script Complete::**✅ MAgroup.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # Verification of core files
          if [ -f "macg.m3u" ] && [ -d "MacG" ]; then
              echo "✅ Output file macg.m3u and folder MacG found."
          else
              echo "❌ Required outputs missing."
              ls -la
              exit 1 
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "macg.m3u"
          DEST_PATH: "/MyStuff/macg.m3u"

      - name: Upload Links List to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "links_list.txt"
          DEST_PATH: "/MyStuff/links_list.txt"

      - name: Upload Bridge Folder to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "MacG"
          DEST_PATH: "/MyStuff/MacG"
