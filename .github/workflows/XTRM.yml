name: Scraper Script MAgroup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-magroup-script:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      # This fixes the "Error loading config file" permission error
      DOCKER_CONFIG: /tmp/.docker 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv curl git
          python3 -m venv venv
          source venv/bin/activate
          pip install requests
        shell: bash

      - name: Download MAgroup Script
        run: |
          # URL is now pulled from GITHUB_SECRET: MACGROUP_URL
          curl -L -o MAgroup.py "${{ secrets.MACGROUP_URL }}"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          # Create directory if script doesn't
          mkdir -p MAG
          # Ensure output is flushed to console as per your preference
          PYTHONUNBUFFERED=1 python MAgroup.py
        shell: bash

      - name: Deploy MAG folder to GitHub
        run: |
          # CRITICAL to avoid "dubious ownership" errors in containers
          git config --global --add safe.directory /__w/MyPlaylist/MyPlaylist
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add and commit if the folder exists and has changes
          if [ -d "MAG" ]; then
            git add MAG/
            git commit -m "Update MAG obfuscated links" || echo "No changes to commit"
            git push origin main || echo "Push failed or no changes"
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox
        if: hashFiles('macg.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "macg.m3u"
          dest_path: "/MyStuff/macg.m3u"
