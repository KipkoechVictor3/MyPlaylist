name: TML Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/35 * * * *'

jobs:
  update-tml-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: |
          apt-get update
          apt-get install -y python3-venv git curl
          python3 -m venv venv
          source venv/bin/activate
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          playwright install firefox
        shell: bash

      - name: Download Scraper
        run: |
          curl -L -o TML.py "https://www.dropbox.com/scl/fi/e964mvuhtf5i7hm0be2f6/TIM_Scraper.py?rlkey=sr36si4z0cbdn2ojanzcz6dnv&st=sh2fvutx&dl=1"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          python TML.py || echo "Scraper encountered issues..."
        shell: bash

      - name: Prepare Files
        run: |
          # Rename for Dropbox
          if [ -f "S4.m3u8" ]; then mv S4.m3u8 TML.m3u; fi
          # Ensure we don't accidentally track the main playlist in Git
          rm -f S4.m3u8
        shell: bash

      - name: Push IDs to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Delete any existing TML.m3u from repo to be safe
          git rm -f TML.m3u || true
          
          mkdir -p streams
          git add streams/*.m3u8
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Refresh IDs: $(date)"
            git push origin main
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: TML.m3u
          DEST_PATH: /MyStuff/TML.m3u
