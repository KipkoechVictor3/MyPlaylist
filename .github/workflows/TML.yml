name: TMLMain Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Runs exactly every hour

jobs:
  update-TML-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          pip install playwright==1.55.0 httpx
          playwright install firefox
        shell: bash

      - name: Download Scraper
        run: |
          # Downloading your specific TMLMain.py script
          curl -L -o "$GITHUB_WORKSPACE/TMLMain.py" "https://www.dropbox.com/scl/fi/3lhquuxhvtbwpo3pzi99d/TMLMain.py?rlkey=zpiwgjs8tsgm9b2r116o43dui&st=8yzkpwst&dl=1"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          # Run the script. Headless is forced via the Python modification below for CI stability.
          python TMLMain.py
        shell: bash

      - name: Verify File Generation
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f "S4.m3u8" ]; then
            echo "✅ S4.m3u8 successfully generated."
            ls -lh S4.m3u8
          else
            echo "❌ ERROR: S4.m3u8 was not created!"
            ls -R
            exit 1
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S4.m3u8
          DEST_PATH: /MyStuff/S4.m3u8
