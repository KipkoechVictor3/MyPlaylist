name: TML Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/35 * * * *'

jobs:
  update-tml-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv git curl
          python3 -m venv venv
          source venv/bin/activate
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          playwright install firefox
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          # We run the script present in the repo. 
          # Ensure you have committed the TML.py code I gave you previously.
          python TML.py || echo "Scraper finished with warnings."
        shell: bash

      - name: Verify File Generation
        run: |
          if [ -f "TML.m3u" ]; then
            echo "✅ TML.m3u successfully generated."
            ls -lh TML.m3u
          else
            echo "❌ ERROR: TML.m3u was not created!"
            exit 1
          fi
        shell: bash

      - name: Commit Changes (Optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # We don't really need to commit the M3U to GitHub if we use Dropbox,
          # but we can keep the repo clean.
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Playlist Sync: $(date)"
            git push origin main --force
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          # Changed to match the output of the new TML.py script
          source_path: TML.m3u 
          DEST_PATH: /MyStuff/TML.m3u
