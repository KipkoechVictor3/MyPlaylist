name: TML Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/35 * * * *'

jobs:
  update-tml-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          # Installing required dependencies
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          playwright install firefox
        shell: bash

      - name: Download Scraper
        run: |
          curl -L -o "$GITHUB_WORKSPACE/TML.py" "https://www.dropbox.com/scl/fi/e964mvuhtf5i7hm0be2f6/TIM_Scraper.py?rlkey=sr36si4z0cbdn2ojanzcz6dnv&st=sh2fvutx&dl=1"
        shell: bash

      - name: Run Scraper
        run: |
          source venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          # Run the scraper to generate TML.m3u
          python TML.py 
        shell: bash

      - name: Verify File Generation
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f "TML.m3u" ]; then
            echo "✅ TML.m3u successfully generated."
            ls -lh TML.m3u
          else
            echo "❌ ERROR: TML.m3u was not created!"
            ls -R
            exit 1
          fi
        shell: bash

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: TML.m3u 
          DEST_PATH: /MyStuff/TML.m3u
