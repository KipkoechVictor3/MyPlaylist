name: TML Playlist Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/35 * * * *'

jobs:
  update-tml-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Built-in token

      - name: Set up Python and dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv git
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          playwright install firefox
        shell: bash

      - name: Run TML Scraper
        run: |
          source venv/bin/activate
          # Note: I am assuming your script is in the repo as TML.py
          # If you still want to download it from Dropbox, add the curl step here
          python TML.py || echo "⚠️ TML scraper failed but continuing..."
        shell: bash

      - name: Rename Output to TML.m3u
        run: |
          if [ -f "S4.m3u8" ]; then
            mv S4.m3u8 TML.m3u
            echo "✅ Renamed S4.m3u8 → TML.m3u"
          else
            echo "⚠️ No S4.m3u8 found; creating empty TML.m3u."
            echo "#EXTM3U" > TML.m3u
          fi
        shell: bash

      - name: Commit and Push dynamic stream files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Safe add the streams directory
          mkdir -p streams
          git add streams/*.m3u8 TML.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update dynamic streams [$(date)]"
            git push
          fi
        shell: bash

      - name: Upload TML Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: TML.m3u
          DEST_PATH: /MyStuff/TML.m3u
