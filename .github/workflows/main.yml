name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install firefox
          playwright install-deps firefox

      - name: Run XYZ Scraper
        continue-on-error: true
        run: |
          curl -L -f -o XYZ.py "${{ secrets.XYZ_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u XYZ.py || echo "XYZ failed"
          sync

      - name: Run NinjaSGO Scraper
        continue-on-error: true
        run: |
          curl -L -f -o ninjasgo.py "${{ secrets.NINJASGO_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u ninjasgo.py || echo "Ninja failed"
          sync

      - name: Run ROX Scraper
        continue-on-error: true
        run: |
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u rox_script.py || echo "ROX failed"
          sync

      - name: Run PITS Scraper
        continue-on-error: true
        run: |
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o pits.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u pits.py || echo "PITS failed"
          sync

      - name: Run MovByte Scraper
        continue-on-error: true
        run: |
          curl -L -f -o movbyte.py "${{ secrets.MOVEBITE_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u movbyte.py || echo "MovByte failed"
          sync

      - name: Run DamiChannels Scraper
        continue-on-error: true
        run: |
          curl -L -f -o dami_channels.py "${{ secrets.DAMICHANNELS_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u dami_channels.py || echo "DamiC failed"
          sync

      - name: Run DamiChannels Resolved Scraper
        continue-on-error: true
        run: |
          curl -L -f -o dami_channels_resolved.py "${{ secrets.DAMICHANNELS_RESOLVED_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u dami_channels_resolved.py || echo "DamiC Resolved failed"
          sync

      - name: Run SPX Scraper
        continue-on-error: true
        run: |
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "SPX failed"
          sync

      - name: Run DamiPPV Scraper
        continue-on-error: true
        run: |
          curl -L -f -o DamiPPV.py "${{ secrets.DAMIPPV_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiPPV.py || echo "DamiPPV failed"
          sync

      - name: Run RawGit Scraper
        continue-on-error: true
        run: |
          curl -L -f -o RawGit_Scraper.py "${{ secrets.RAWGIT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u RawGit_Scraper.py || echo "RawGit failed"
          sync

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyPlayList.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"

          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          curl -L -f -k --connect-timeout 15 "https://www.dropbox.com/scl/fi/a1ux3ha4kwn5pb895jj5s/Mediauu.m3u?rlkey=z688agdc3h5o8312j00fwe4qx&st=th1tmh3k&dl=1" -o "dropbox_mediauu.m3u" -s

          # Added pits_raw.m3u8 alongside pits_vlc.m3u8
          for f in "pits_vlc.m3u8" "pits_raw.m3u8" "XYZplaylist.m3u" "SGo.m3u" "rox.m3u" "DamiPPV_vlc.m3u8" "spx.m3u" "playlist.m3u8" "channels.m3u" "dropbox_mediauu.m3u" "RawGit.m3u" "resolved_channels.m3u" "DChannels.m3u"; do
            if [ -s "$f" ]; then
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done
          rm -f dropbox_mediauu.m3u

          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 15 "$url" -o "$temp" -s; then
                echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
                sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      - name: Final Cleanup
        run: |
          sed -i 's/\r//g' MyPlayList.m3u
          sed -i '/^[[:space:]]*$/d' MyPlayList.m3u

      - name: Deploy Script Folders to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ptsp/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update Scraper Data: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyPlayList.m3u
          dest_path: /MyStuff/MyPlayList.m3u
