name: Combined Remote Playlist

on:
  schedule:
    - cron: '0,40 4 * * *'
    - cron: '20 5 * * *'
    - cron: '0,40 6 * * *'
    - cron: '10,40 7 * * *'
    - cron: '20 8 * * *'
    - cron: '0,50 9 * * *'
    - cron: '40 10 * * *'
    - cron: '3,40 11 * * *'
    - cron: '5,33 12 * * *'
    - cron: '0,35 13 * * *'
    - cron: '5,35 14 * * *'
    - cron: '3,40 15 * * *'
    - cron: '10,30 16 * * *'
    - cron: '0,40 17 * * *'
    - cron: '0,33 18 * * *'
    - cron: '5,30 19 * * *'
    - cron: '3 20 * * *'
  workflow_dispatch:

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp
      HTTP_KEEP_ALIVE: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl git
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 httpx[http2] aiohttp dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4
          playwright install firefox
        shell: bash

      - name: Run TMLMain Scraper
        run: |
          source venv/bin/activate
          mkdir -p TMS
          curl -L -o TMLMain.py "${{ secrets.TMLMAIN_URL }}"
          timeout 450s python TMLMain.py || echo "⚠️ TMLMain timed out or failed, skipping..."
          sync
        shell: bash

      - name: Run CATFT Scraper
        run: |
          source venv/bin/activate
          curl -L -o CATFt.py "${{ secrets.CATFT_URL }}"
          timeout 360s python CATFt.py || echo "⚠️ CATFT timed out or failed, skipping..."
          sync
        shell: bash

      - name: Run RRACE Scraper
        run: |
          source venv/bin/activate
          echo "--- Running RRACE (F1TV) Scraper ---"
          # Download the script from the secret URL
          curl -L -o rrace.py "${{ secrets.RRACE_URL }}"
          # Execute and ensure output is rftv.m3u (Script should be set to save as rftv.m3u)
          timeout 600s python rrace.py || echo "⚠️ RRACE timed out or failed, skipping..."
          sync
        shell: bash

      - name: Run SS99 Scrapers
        run: |
          source venv/bin/activate
          echo "--- Running SS99 Channels ---"
          curl -L -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          timeout 360s python SS99_Channels.py || echo "⚠️ SS99 Channels timed out, skipping..."
          sync && sleep 2
          echo "--- Running SS99 Events ---"
          curl -L -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          timeout 360s python SS99_Events_Scraper.py || echo "⚠️ SS99 Events timed out, skipping..."
          sync
        shell: bash

      - name: Run SPX Scraper
        run: |
          source venv/bin/activate
          curl -L -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python -u SpX.py || echo "⚠️ SPX Script timed out or failed, skipping..."
          sync
        shell: bash

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          
          # Added rftv.m3u to the merge list
          for f in "Combined_Sports.m3u" "spx.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "S4.m3u8" "rftv.m3u"; do
            if [ -s "$f" ]; then
              echo "✅ Merging $f..."
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          echo -e "\n--- Merging Remote Playlists ---"
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          tr -d '\r' < channels.txt > channels_clean.txt
          
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            STATUS=$(curl -L -f -k --connect-timeout 10 --max-time 20 "$url" -o "$temp" -s -w "%{http_code}")
            if [ "$STATUS" -eq 200 ] && [ -s "$temp" ]; then
              echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < "channels_clean.txt"
          set -e
        shell: bash

      - name: Final Cleanup and Stats
        run: |
          if [ -f MyStuffCLW.m3u ]; then
            sed -i 's/\r//g' MyStuffCLW.m3u
            sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u
            echo "🚀 Master Playlist Finalized. Total Lines: $(wc -l < MyStuffCLW.m3u)"
          fi
        shell: bash

      - name: Upload Master Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          DEST_PATH: /MyStuff/MyStuffCLW.m3u

      - name: Upload S4 Direct
        if: hashFiles('S4.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S4.m3u8
          DEST_PATH: /MyStuff/S4.m3u8

      - name: Upload CATFT Standalone to Dropbox
        if: hashFiles('Combined_Sports.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: Combined_Sports.m3u
          DEST_PATH: /MyStuff/Combined_Sports.m3u

      - name: Upload RRACE Standalone to Dropbox
        if: hashFiles('rftv.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: rftv.m3u
          DEST_PATH: /MyStuff/rftv.m3u
