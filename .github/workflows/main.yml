name: Combined Remote Playlist

on:
  schedule:
    - cron: '0,40 4 * * *'
    - cron: '20 5 * * *'
    - cron: '0,40 6 * * *'
    - cron: '10,40 7 * * *'
    - cron: '20 8 * * *'
    - cron: '0,50 9 * * *'
    - cron: '40 10 * * *'
    - cron: '3,40 11 * * *'
    - cron: '5,33 12 * * *'
    - cron: '0,35 13 * * *'
    - cron: '5,35 14 * * *'
    - cron: '3,40 15 * * *'
    - cron: '10,30 16 * * *'
    - cron: '0,40 17 * * *'
    - cron: '0,33 18 * * *'
    - cron: '5,30 19 * * *'
    - cron: '3 20 * * *'
  workflow_dispatch:

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      PYTHONUNBUFFERED: "1"
      HOME: /root
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment and Dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip python3-full curl xvfb git
          python3 -m pip install httpx[http2] aiohttp dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright --break-system-packages
          playwright install firefox chromium
          playwright install chrome
        shell: bash

      - name: Run Scraper (PPL)
        continue-on-error: true
        run: |
          echo "--- Running PPV.CX (PPL_SCRIPT) ---"
          curl -L -o PPL_SCRIPT.py "${{ secrets.PPL_SCRIPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 PPL_SCRIPT.py || echo "⚠️ PPL_SCRIPT failed, skipping..."
          sync
        shell: bash

      - name: Run Scraper (TMLN)
        continue-on-error: true
        run: |
          echo "--- Preparing TMSS Folder ---"
          mkdir -p TMSS
          # Fix permission denied errors for the container user
          chmod -R 777 TMSS
          # Clear existing files
          rm -rf TMSS/*
          
          echo "--- Running TimStreams (TMLMAIN) ---"
          curl -L -o TMLMAIN.py "${{ secrets.TMLMAIN_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 TMLMAIN.py || echo "⚠️ TMLMAIN failed, skipping..."
          sync
        shell: bash

      - name: Run RRACE Scraper
        continue-on-error: true
        run: |
          echo "--- Running RRACE Scraper ---"
          curl -L -o rrace.py "${{ secrets.RRACE_URL }}"
          timeout 600s python3 rrace.py || echo "⚠️ RRACE failed, skipping..."
          sync
        shell: bash

      - name: Run SS99 Scrapers
        continue-on-error: true
        run: |
          echo "--- Running SS99 Scrapers ---"
          curl -L -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          timeout 360s python3 SS99_Channels.py || echo "⚠️ SS99 Channels failed..."
          curl -L -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          timeout 360s python3 SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed..."
          sync
        shell: bash

      - name: Run SPX Scraper
        continue-on-error: true
        run: |
          curl -L -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "⚠️ SPX failed..."
          sync
        shell: bash

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          REPORT_FILE="merge_report.txt"
          
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          echo "📊 PLAYLIST MERGE REPORT - $(date)" > "$REPORT_FILE"
          echo "------------------------------------------------" >> "$REPORT_FILE"
          
          echo -e "\n--- Processing Scraped Local Files ---"
          for f in "pcx.m3u" "tms1.m3u" "spx.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "S4.m3u8" "rftv.m3u"; do
            if [ -s "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "✅ [SUCCESS] $f ($SIZE) - Merging..."
              echo "✅ LOCAL  | $f | Size: $SIZE | Status: ADDED" >> "$REPORT_FILE"
              echo -e "\n######## SOURCE: ${f%.*} | SIZE: $SIZE ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            else
              echo "❌ [SKIPPED] $f - Empty or Not Found"
              echo "❌ LOCAL  | $f | Status: MISSING/EMPTY" >> "$REPORT_FILE"
            fi
          done

          echo -e "\n--- Processing Remote Playlists ---"
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          tr -d '\r' < channels.txt > channels_clean.txt
          
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            STATUS=$(curl -L -f -k --connect-timeout 10 --max-time 25 "$url" -o "$temp" -s -w "%{http_code}")
            if [ "$STATUS" -eq 200 ] && [ -s "$temp" ]; then
              SIZE=$(du -h "$temp" | cut -f1)
              echo "✅ [SUCCESS] $url ($SIZE)"
              echo "✅ REMOTE | $url | Size: $SIZE | Status: ADDED" >> "$REPORT_FILE"
              echo -e "\n######## REMOTE: $url | SIZE: $SIZE ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < "channels_clean.txt"
          set -e
        shell: bash

      - name: Git Push Obfuscated TMSS Links
        run: |
          git config --global --add safe.directory /__w/MyPlaylist/MyPlaylist
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p TMSS
          # Ensuring deleted files are tracked so they are removed from the repo
          git add -A TMSS/
          git commit -m "Update and clean TMSS obfuscated links" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
        shell: bash

      - name: Final Cleanup and Stats
        run: |
          if [ -f MyStuffCLW.m3u ]; then
            sed -i 's/\r//g' MyStuffCLW.m3u
            sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u
            echo "🚀 Master Playlist Finalized. Total Lines: $(wc -l < MyStuffCLW.m3u)"
          fi
        shell: bash

      - name: Upload Master Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          dest_path: /MyStuff/MyStuffCLW.m3u

      - name: Upload Standalone PCX to Dropbox
        if: hashFiles('pcx.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: pcx.m3u
          dest_path: /MyStuff/pcx.m3u

      - name: Upload Standalone TMS1 to Dropbox
        if: hashFiles('tms1.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: tms1.m3u
          dest_path: /MyStuff/tms1.m3u

      - name: Upload RRACE Standalone to Dropbox
        if: hashFiles('rftv.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: rftv.m3u
          dest_path: /MyStuff/rftv.m3u

      - name: Upload Merge Report to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: merge_report.txt
          dest_path: /MyStuff/merge_report.txt
