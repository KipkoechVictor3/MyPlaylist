name: Combined Remote Playlist

on:
  schedule:
    - cron: '0,40 4 * * *'
    - cron: '20 5 * * *'
    - cron: '0,40 6 * * *'
    - cron: '10,40 7 * * *'
    - cron: '20 8 * * *'
    - cron: '0,50 9 * * *'
    - cron: '40 10 * * *'
    - cron: '3,40 11 * * *'
    - cron: '5,33 12 * * *'
    - cron: '0,35 13 * * *'
    - cron: '5,35 14 * * *'
    - cron: '3,40 15 * * *'
    - cron: '10,30 16 * * *'
    - cron: '0,40 17 * * *'
    - cron: '0,33 18 * * *'
    - cron: '5,30 19 * * *'
    - cron: '3 20 * * *'
  workflow_dispatch:

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      PYTHONUNBUFFERED: "1"
      HOME: /root
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment and Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pip python3-full curl xvfb git
          python3 -m pip install httpx[http2] aiohttp dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright --break-system-packages
          playwright install chrome msedge chromium firefox webkit

      - name: Run PPL Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running PPL Scraper ---"
          curl -L -f -o ppl_script.py "${{ secrets.PPL_SCRIPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u ppl_script.py || echo "⚠️ PPL failed..."
          sync

      - name: Run Scraper (TMLN)
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running TimStreams (TMLMAIN) ---"
          curl -L -f -o TMLMAIN.py "${{ secrets.TMLMAIN_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 TMLMAIN.py || echo "⚠️ TMLMAIN failed, skipping..."
          sync

      - name: Run SPX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SPX Scraper ---"
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "⚠️ SPX failed..."
          sync

      - name: Run SS99 Scrapers
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SS99 Scrapers ---"
          curl -L -f -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          timeout 360s python3 SS99_Channels.py || echo "⚠️ SS99 Channels failed..."
          curl -L -f -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          timeout 360s python3 SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed..."
          sync

      - name: Run SFREE Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SFREE Scraper ---"
          curl -L -f -o sfree.py "${{ secrets.SFREE_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u sfree.py || echo "⚠️ SFREE failed..."
          sync

      - name: Run PTSPT Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running PitSport Scraper ---"
          curl -L -f -o pitspt_scraper.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 pitspt_scraper.py || echo "⚠️ PTSPT failed, skipping..."
          sync

      - name: Run RRACE Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running RRACE Scraper ---"
          curl -L -f -o rrace.py "${{ secrets.RRACE_URL }}"
          timeout 600s python3 rrace.py || echo "⚠️ RRACE failed, skipping..."
          sync

      - name: Process and Merge All Playlists
        shell: bash
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          
          echo -e "\n--- Merging Hierarchy ---"
          # Hierarchy: PPL > TMLMAIN > SPX > SS99 > SFREE > Events > Others
          for f in "pcx.m3u" "tms1.m3u" "spx.m3u" "SSpo99.m3u8" "stfree.m3u" "SS99_Events.m3u8" "pitspt.m3u" "S4.m3u8" "rftv.m3u"; do
            if [ -s "$f" ]; then
              echo "✅ Merging $f"
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          echo -e "\n--- Fetching Remote Playlists ---"
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 10 "$url" -o "$temp" -s; then
               echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
               sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      - name: Final Cleanup
        shell: bash
        run: |
          sed -i 's/\r//g' MyStuffCLW.m3u
          sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u

      - name: Upload Combined Playlist
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          dest_path: /MyStuff/MyStuffCLW.m3u

      # --- INDIVIDUAL BACKUPS ---
      - name: Upload PPL (pcx)
        if: hashFiles('pcx.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: pcx.m3u
          dest_path: /MyStuff/pcx.m3u

      - name: Upload TMLMAIN (tms1)
        if: hashFiles('tms1.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: tms1.m3u
          dest_path: /MyStuff/tms1.m3u

      - name: Upload SPX (spx)
        if: hashFiles('spx.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: spx.m3u
          dest_path: /MyStuff/spx.m3u

      - name: Upload SS99 Channels
        if: hashFiles('SSpo99.m3u8') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SSpo99.m3u8
          dest_path: /MyStuff/SSpo99.m3u8

      - name: Upload SFREE (stfree)
        if: hashFiles('stfree.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: stfree.m3u
          dest_path: /MyStuff/stfree.m3u

      - name: Upload SS99 Events
        if: hashFiles('SS99_Events.m3u8') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SS99_Events.m3u8
          dest_path: /MyStuff/SS99_Events.m3u8

      - name: Upload PitSport (pitspt)
        if: hashFiles('pitspt.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: pitspt.m3u
          dest_path: /MyStuff/pitspt.m3u

      - name: Upload RRACE (rftv)
        if: hashFiles('rftv.m3u') != ''
        continue-on-error: true
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: rftv.m3u
          dest_path: /MyStuff/rftv.m3u
