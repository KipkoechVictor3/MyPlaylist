name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install firefox chromium
          playwright install-deps firefox chromium

      - name: Run DamiPopular Scraper
        continue-on-error: true
        run: |
          curl -L -f -o DamiPopular.py "${{ secrets.DAMI_POPULAR_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiPopular.py || echo "DamiPopular failed"
          sync

      - name: Run DamiChannels Scraper
        continue-on-error: true
        run: |
          curl -L -f -o DamiChannels.py "${{ secrets.DAMICHANNELS_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiChannels.py || echo "DamiChannels failed"
          sync

      - name: Run XYZ Scraper
        continue-on-error: true
        run: |
          curl -L -f -o xyz.py "${{ secrets.XYZ_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u xyz.py || echo "XYZ failed"
          sync

      - name: Run ROX Scraper
        continue-on-error: true
        run: |
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u rox_script.py || echo "ROX failed"
          sync

      - name: Run PITS Scraper
        continue-on-error: true
        run: |
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o pits.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u pits.py || echo "PITS failed"
          sync

      - name: Run SPX Scraper
        continue-on-error: true
        run: |
          curl -L -f -o spx_script.py "${{ secrets.SPX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u spx_script.py || echo "SPX failed"
          sync

      - name: Run MovByte Scraper
        continue-on-error: true
        run: |
          curl -L -f -o movbyte.py "${{ secrets.MOVEBITE_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u movbyte.py || echo "MovByte failed"
          sync

      - name: Run MovBiteChannels Scraper
        continue-on-error: true
        run: |
          curl -L -f -o movbite_channels.py "${{ secrets.MOVBITECHANNELS_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u movbite_channels.py || echo "MovBiteChannels failed"
          sync

      - name: Run DamiDaddyBite Scraper
        continue-on-error: true
        run: |
          curl -L -f -o dami_daddybite.py "${{ secrets.DAMIDADDYBITE_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u dami_daddybite.py || echo "DamiDaddyBite failed"
          sync

      - name: Run DamiPPV Scraper
        continue-on-error: true
        run: |
          curl -L -f -o DamiPPV.py "${{ secrets.DAMIPPV_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiPPV.py || echo "DamiPPV failed"
          sync

      - name: Run RawGit Scraper
        continue-on-error: true
        run: |
          curl -L -f -o RawGit_Scraper.py "${{ secrets.RAWGIT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u RawGit_Scraper.py || echo "RawGit failed"
          sync

      - name: Run SS99 Events Scraper
        continue-on-error: true
        run: |
          rm -rf ss99events/* && mkdir -p ss99events
          curl -L -f -o ss99_events.py "${{ secrets.SS99_EVENTS_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u ss99_events.py || echo "SS99 Events failed"
          sync

      - name: Run SS99 Channels Scraper
        continue-on-error: true
        run: |
          rm -rf ss99channels/* && mkdir -p ss99channels
          curl -L -f -o ss99_channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u ss99_channels.py || echo "SS99 Channels failed"
          sync

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyPlayList.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"

          # Fetch and process the Channels.m3u8 remote link from Dropbox FIRST
          CHANNELS_TEMP="channels_temp.m3u8"
          if curl -L -f -k -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --connect-timeout 15 "https://www.dropbox.com/scl/fi/gl2hvy7ozhd28bn21espb/Channels.m3u8?rlkey=rjrpuyexji855s9wmt7jyxzvd&st=1uu9kuqs&dl=1" -o "$CHANNELS_TEMP" -s; then
            if [ -s "$CHANNELS_TEMP" ]; then
              echo -e "\n######## REMOTE: Channels.m3u8 ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$CHANNELS_TEMP" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
              
              # Verification logging for Channels.m3u8
              echo "==> Channels.m3u8 Verification <=="
              echo "File size: $(wc -c < "$CHANNELS_TEMP") bytes"
              echo "Total lines: $(wc -l < "$CHANNELS_TEMP")"
              echo "Checking line lengths (first 10 lines):"
              awk '{print "Line " NR " length:", length}' "$CHANNELS_TEMP" | head -n 10
            fi
          fi
          rm -f "$CHANNELS_TEMP"

          # Fetch common files
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          curl -L -f -k -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --connect-timeout 15 "https://www.dropbox.com/scl/fi/5xk2pwf36svddp39yqrp5/Mediauu.m3u?rlkey=s1gsuqpnco9ilj97p8vf3phj2&st=uworudum&dl=1" -o "dropbox_mediauu.m3u" -s
          curl -L -f -k -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --connect-timeout 15 "https://www.dropbox.com/scl/fi/k4iafut5kmys261ms3951/asarao.m3u8?rlkey=ovcvg7zqydoivrw4vanub9su4&st=me5y4i2h&dl=1" -o "asarao.m3u8" -s

          # Loop through existing structured local outputs
          for f in "Damiplaylist.m3u" "DamiPopular.m3u8" "tms1.m3u" "Pits.m3u8" "BiteEvents.m3u8" "rox.m3u" "xyz.m3u8" "SS99_Events.m3u8" "SSpo99.m3u8" "Daddy247.m3u8" "spx.m3u" "DamiPPV_vlc.m3u8" "SGo.m3u" "playlist.m3u8" "ddhd.m3u8" "Bite.m3u8" "dropbox_mediauu.m3u" "asarao.m3u8"; do
            if [ -s "$f" ]; then
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
              
              # Verification logging for Mediauu / dropbox_mediauu
              if [ "$f" = "dropbox_mediauu.m3u" ]; then
                echo "==> dropbox_mediauu.m3u Verification <=="
                echo "File size: $(wc -c < "$f") bytes"
                echo "Total lines: $(wc -l < "$f")"
                echo "Checking line lengths (first 10 lines):"
                awk '{print "Line " NR " length:", length}' "$f" | head -n 10
              fi
              
              # Verification logging for asarao.m3u8
              if [ "$f" = "asarao.m3u8" ]; then
                echo "==> asarao.m3u8 Verification <=="
                echo "File size: $(wc -c < "$f") bytes"
                echo "Total lines: $(wc -l < "$f")"
              fi
            fi
          done
          rm -f dropbox_mediauu.m3u
          rm -f asarao.m3u8

          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 15 "$url" -o "$temp" -s; then
                echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
                sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      current-time-step:
        run: echo "Current Execution Time $(date)"

      - name: Final Cleanup
        run: |
          sed -i 's/\r//g' MyPlayList.m3u
          sed -i '/^[[:space:]]*$/d' MyPlayList.m3u

      - name: Deploy Script Folders to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force create a placeholder file if a directory turns out empty so git doesn't skip it
          mkdir -p ptsp ss99events ss99channels
          touch ptsp/.gitkeep ss99events/.gitkeep ss99channels/.gitkeep
          
          git add ptsp/ ss99events/ ss99channels/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Update Scraper Data: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyPlayList.m3u
          dest_path: /MyStuff/MyPlayList.m3u
