name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  workflows: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      PYTHONUNBUFFERED: "1"
      HOME: /root
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Environment and Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pip python3-full curl xvfb git
          python3 -m pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright --break-system-packages
          playwright install chromium chrome firefox
          playwright install-deps

      - name: Run Scraper (TMS/TMLN)
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running TimStreams (TMLMAIN) ---"
          rm -rf TML/* && mkdir -p TML
          curl -L -f -o TMLMAIN.py "${{ secrets.TMLMAIN_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u TMLMAIN.py || echo "⚠️ TMLMAIN failed..."
          [ -f "tms1.m3u" ] && du -sh tms1.m3u || echo "❌ tms1.m3u not found"
          sync

      - name: Run DamiTV Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running DamiTV Scraper ---"
          curl -L -f -o DamiTV.py "${{ secrets.DAMI_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiTV.py || echo "⚠️ DamiTV failed..."
          [ -f "DamiTV.m3u" ] && du -sh DamiTV.m3u || echo "❌ DamiTV.m3u not found"
          sync

      - name: Run PitSport Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running PitSport Scraper ---"
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o pitspt_scraper.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u pitspt_scraper.py || echo "⚠️ PTSPT failed..."
          [ -f "pitspt.m3u" ] && du -sh pitspt.m3u || echo "❌ pitspt.m3u not found"
          sync

      - name: Run ROX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running ROX Scraper ---"
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u rox_script.py || echo "⚠️ ROX failed..."
          [ -f "rox.m3u" ] && du -sh rox.m3u || echo "❌ rox.m3u not found"
          sync

      - name: Run SS99 Scrapers
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SS99 Scrapers ---"
          rm -rf SS99/* ss99events/* && mkdir -p SS99 ss99events
          curl -L -f -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          timeout 600s python3 -u SS99_Channels.py || echo "⚠️ SS99 Channels failed..."
          curl -L -f -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          timeout 360s python3 -u SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed..."
          sync

      - name: Run SPX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SPX Scraper ---"
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "⚠️ SPX failed..."
          [ -f "spx.m3u" ] && du -sh spx.m3u || echo "❌ spx.m3u not found"
          sync

      - name: Process and Merge All Playlists
        shell: bash
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"

          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          
          for f in "tms1.m3u" "DamiTV.m3u" "pitspt.m3u" "rox.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "spx.m3u"; do
            if [ -s "$f" ]; then
              SIZE=$(du -kb "$f" | cut -f1)
              echo "[*] Merging $f ($SIZE KB)"
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            if [[ "$url" == *"stfree.m3u"* ]]; then
               if curl -L -f -k --connect-timeout 10 "$url" -o "temp_stfree.m3u" -s; then
                  echo -e "\n######## SOURCE: STRFREE (Remote) ########" >> "$OUTPUT_FILE"
                  sed 's/\r$//' "temp_stfree.m3u" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
               fi
            fi
          done < <(tr -d '\r' < channels.txt)

          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            [[ "$url" == *"stfree.m3u"* ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 10 "$url" -o "$temp" -s; then
                echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
                sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      - name: Final Cleanup and Integrity Check
        shell: bash
        run: |
          sed -i 's/\r//g' MyStuffCLW.m3u
          sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u
          FINAL_SIZE=$(du -sh MyStuffCLW.m3u | cut -f1)
          echo "[*] Final Playlist Size: $FINAL_SIZE"

      - name: Deploy All Folders and Files to GitHub
        shell: bash
        run: |
          git config --global --add safe.directory /__w/MyPlaylist/MyPlaylist
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git reset --soft origin/main
          
          # TARGETED ADD ONLY: This avoids the .github/ folder
          git add TML/ SS99/ ss99events/ rox/ ptsp/ *.m3u *.m3u8
          
          git commit -m "Update Playlists: $(date +'%Y-%m-%d %H:%M') [Size: $(du -sh MyStuffCLW.m3u | cut -f1)]" || echo "No changes to commit"
          git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          dest_path: /MyStuff/MyStuffCLW.m3u

      - name: Upload Backups to Dropbox
        if: always()
        run: echo "Dropbox backups complete."
