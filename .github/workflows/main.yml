name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright

      - name: Install Playwright Firefox
        run: |
          playwright install firefox
          playwright install-deps firefox

      # --- SCRAPER EXECUTION (PRIORITY ORDER) ---

      - name: Run Scraper (TMS/TMLN)
        continue-on-error: true
        run: |
          echo "--- Running TimStreams (TMLMAIN) ---"
          rm -rf TML/* && mkdir -p TML
          curl -L -f -o TMLMAIN.py "${{ secrets.TMLMAIN_URL }}"
          xvfb-run --auto-servernum python3 -u TMLMAIN.py || echo "⚠️ TMLMAIN failed..."
          sync

      - name: Run RawGit Scraper (Priority: Immediately after TMS)
        continue-on-error: true
        run: |
          echo "--- Running RawGit Scraper ---"
          curl -L -f -o RawGit_Scraper.py "${{ secrets.RAWGIT_URL }}"
          xvfb-run --auto-servernum python3 -u RawGit_Scraper.py || echo "⚠️ RawGit failed..."
          sync

      - name: Run PTSPT Scraper
        continue-on-error: true
        run: |
          echo "--- Running PTSPT Scraper ---"
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o PTSPT.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum python3 -u PTSPT.py || echo "⚠️ PTSPT failed..."
          sync

      - name: Run ROX Scraper
        continue-on-error: true
        run: |
          echo "--- Running ROX Scraper ---"
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum python3 -u rox_script.py || echo "⚠️ ROX failed..."
          sync

      - name: Run SS99 Scrapers
        continue-on-error: true
        run: |
          rm -rf SS99/* ss99events/* && mkdir -p SS99 ss99events
          curl -L -f -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          python3 -u SS99_Channels.py || echo "⚠️ SS99 Channels failed..."
          curl -L -f -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          python3 -u SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed..."
          sync

      - name: Run SPX Scraper
        continue-on-error: true
        run: |
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          python3 -u SpX.py || echo "⚠️ SPX failed..."
          sync

      # --- MERGE LOGIC (ORDER: TMS -> RawGit -> Others) ---

      - name: Process and Merge All Playlists
        run: |
          OUTPUT_FILE="MyStuffCLW.m3u"
          echo "#EXTM3U url-tvg=\"https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz\"" > "$OUTPUT_FILE"
          
          # This order determines the final playlist sequence
          for f in "tms1.m3u" "RawGit.m3u" "pitspt.m3u" "rox.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "spx.m3u"; do
            if [ -s "$f" ]; then
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

      - name: Final Cleanup
        run: |
          sed -i 's/\r//g' MyStuffCLW.m3u
          sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u

      - name: Deploy Folders to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TML/ SS99/ ss99events/ rox/ ptsp/
          git commit -m "Update Script Data: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push origin main || (git pull origin main --rebase && git push origin main)

      # --- DROPBOX UPLOADS (Using original SHA to ensure it works) ---

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          dest_path: /MyStuff/MyStuffCLW.m3u

      - name: Upload RawGit Backup to Dropbox
        if: hashFiles('RawGit.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: RawGit.m3u
          dest_path: /MyStuff/RawGit.m3u

      - name: Upload ROX Backup to Dropbox
        if: hashFiles('rox.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: rox.m3u
          dest_path: /MyStuff/rox.m3u
