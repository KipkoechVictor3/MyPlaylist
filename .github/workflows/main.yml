name: Combined Remote Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp
      HTTP_KEEP_ALIVE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl git
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          playwright install firefox
        shell: bash

      - name: Run CATFT Scraper
        run: |
          source venv/bin/activate
          echo "--- Downloading CATFT Script ---"
          curl -L -o CATFt.py "https://www.dropbox.com/scl/fi/wf74ev50wjskahwifmzcp/CATFt.py?rlkey=yl569ajzo11dgnblpwf6wd11i&st=7fes2iic&dl=1"
          
          echo "--- Running CATFT Scraper ---"
          python CATFt.py || echo "⚠️ CATFT Script encountered an error, continuing..."
          
          if [ -f "Combined_Sports.m3u" ]; then
             echo "✅ CATFT output generated."
          else
             echo "❌ CATFT output missing."
          fi
        shell: bash

      - name: Run SS99 Scrapers
        run: |
          source venv/bin/activate
          echo "--- Running SS99 Channels Scraper ---"
          curl -L -o SS99_Channels.py "https://www.dropbox.com/scl/fi/o0mxw7v6gfm9eftonscuy/str99.py?rlkey=ehs3jfw6kdig0hgp4a8fb2fit&st=38etoi0k&dl=1"
          python SS99_Channels.py || echo "⚠️ SS99 Channels failed."
          
          sync && sleep 5
          
          echo "--- Running SS99 Events Scraper ---"
          curl -L -o SS99_Events_Scraper.py "https://www.dropbox.com/scl/fi/yuer1q6mc15ri2ifbobqf/ss99Events.py?rlkey=x599l0jqwm4dt3vvvk56vk3s8&st=5o1ux1zx&dl=1"
          python SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed."
        shell: bash

      - name: Run TML Main Scraper
        run: |
          source venv/bin/activate
          sync && sleep 5
          echo "--- Running TML Main Scraper ---"
          curl -L -o TML.py "https://www.dropbox.com/scl/fi/3lhquuxhvtbwpo3pzi99d/TMLMain.py?rlkey=zpiwgjs8tsgm9b2r116o43dui&st=iqy9o1sa&dl=1"
          python TML.py || echo "⚠️ TML Script failed."
          
          if [ -f "S4.m3u8" ]; then
            mv S4.m3u8 TMLMain.m3u8
            echo "✅ TMLMain.m3u8 generated."
          fi
        shell: bash

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          
          echo "--- Merging Scraper Results ---"
          
          # CATFT Merge
          if [ -s "Combined_Sports.m3u" ]; then
            echo "➕ Adding CATFT Content..."
            echo -e "\n######## SOURCE: CATFT SPORTS ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' Combined_Sports.m3u >> "$OUTPUT_FILE"
          fi

          # TML Merge
          if [ -s "TMLMain.m3u8" ]; then
            echo "➕ Adding TML Main Content..."
            echo -e "\n######## SOURCE: TML MAIN ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' TMLMain.m3u8 >> "$OUTPUT_FILE"
          fi

          # SS99 Merges
          if [ -s "SSpo99.m3u8" ]; then
            echo "➕ Adding SS99 Channels..."
            echo -e "\n######## SOURCE: SS99 CHANNELS ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' SSpo99.m3u8 >> "$OUTPUT_FILE"
          fi
          
          if [ -s "SS99_Events.m3u8" ]; then
            echo "➕ Adding SS99 Events..."
            echo -e "\n######## SOURCE: SS99 EVENTS ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' SS99_Events.m3u8 >> "$OUTPUT_FILE"
          fi

          echo -e "\n--- Processing Remote Playlists ---"
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          tr -d '\r' < channels.txt > channels_clean.txt
          
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "📡 Fetching: $url"
            temp="t.m3u"
            STATUS=$(curl -L -f -w "%{http_code}" --connect-timeout 25 "$url" -o "$temp" -s)
            
            if [ "$STATUS" -eq 200 ] && [ -s "$temp" ]; then
              echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
              grep -v '^#EXTM3U' "$temp" >> "$OUTPUT_FILE"
            else
              echo "   ❌ Failed: Status $STATUS"
            fi
            rm -f "$temp"
          done < "channels_clean.txt"
          set -e
        shell: bash

      - name: Final Cleanup and Stats
        run: |
          tr -d '\r' < MyStuffCLW.m3u | sed -E 's/[[:space:]]+$//' | grep -v '^[[:space:]]*$' | tr -s '\n' > temp.m3u
          mv temp.m3u MyStuffCLW.m3u
          echo "🚀 Master Playlist Finalized. Total Lines: $(wc -l < MyStuffCLW.m3u)"
        shell: bash

      - name: Upload Master Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          DEST_PATH: /MyStuff/MyStuffCLW.m3u

      - name: Upload CATFT Standalone to Dropbox
        if: hashFiles('Combined_Sports.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: Combined_Sports.m3u
          DEST_PATH: /MyStuff/Combined_Sports.m3u

      - name: Upload TML Backup to Dropbox
        if: hashFiles('TMLMain.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: TMLMain.m3u8
          DEST_PATH: /MyStuff/TMLMain.m3u8
