name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright

      - name: Install Playwright Browsers
        shell: bash
        run: |
          playwright install firefox chrome chromium
          playwright install-deps firefox chrome chromium

      - name: Run ROX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running ROX Scraper ---"
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u rox_script.py || echo "⚠️ ROX failed..."
          sync

      - name: Run PITS Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running PITS Scraper ---"
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o pits.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u pits.py || echo "⚠️ pits failed..."
          sync

      - name: Run MovByte Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running MovByte Scraper ---"
          curl -L -f -o movbyte.py "${{ secrets.MOVEBITE_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u movbyte.py || echo "⚠️ movbyte failed..."
          sync

      - name: Run SPX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SPX Scraper ---"
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "⚠️ SPX failed..."
          sync

      - name: Run DamiPPV Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running DamiPPV Scraper ---"
          curl -L -f -o DamiPPV.py "${{ secrets.DAMIPPV_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DamiPPV.py || echo "⚠️ DamiPPV failed..."
          sync

      - name: Run RawGit Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running RawGit Scraper ---"
          echo "URL: ${{ secrets.RAWGIT_URL }}"
          curl -L -f -o RawGit_Scraper.py "${{ secrets.RAWGIT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u RawGit_Scraper.py || echo "⚠️ RawGit failed..."
          sync

      - name: Process and Merge All Playlists
        shell: bash
        run: |
          set +e 
          OUTPUT_FILE="MyPlayList.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"

          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          
          # Fetch dynamic Dropbox remote file before merge loop execution
          curl -L -f -k --connect-timeout 15 "https://www.dropbox.com/scl/fi/a1ux3ha4kwn5pb895jj5s/Mediauu.m3u?rlkey=z688agdc3h5o8312j00fwe4qx&st=th1tmh3k&dl=1" -o "dropbox_mediauu.m3u" -s

          # Priority Merge Order: ROX first, then FreeShot, then others, DamiPPV last
          for f in "rox.m3u" "DamiPPV_vlc.m3u8" "pits_vlc.m3u8" "playlist.m3u8" "dropbox_mediauu.m3u" "RawGit.m3u" "spx.m3u"; do
            if [ -s "$f" ]; then
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          # Clean up temporary downloaded file
          rm -f dropbox_mediauu.m3u

          # Process Remote Lists
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 15 "$url" -o "$temp" -s; then
                echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
                sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      - name: Final Cleanup
        shell: bash
        run: |
          sed -i 's/\r//g' MyPlayList.m3u
          sed -i '/^[[:space:]]*$/d' MyPlayList.m3u

      - name: Deploy Script Folders to GitHub
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git reset --soft origin/main
          
          git add rox/ ptsp/
          
          git commit -m "Update Script Data: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyPlayList.m3u
          dest_path: /MyStuff/MyPlayList.m3u

      - name: Upload MovByte Backup
        if: hashFiles('playlist.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: playlist.m3u8
          dest_path: /MyStuff/playlist.m3u8

      - name: Upload PITS Backup
        if: hashFiles('pits_vlc.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: pits_vlc.m3u8
          dest_path: /MyStuff/pits_vlc.m3u8
