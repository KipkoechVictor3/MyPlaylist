name: Combined Workflow

on:
  workflow_dispatch:
  schedule:
    # Runs every 40 minutes
    - cron: '*/40 * * * *'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    container:
      # Using Playwright container, though we'll use Firefox for any potential browser automation based on your preference
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      # CLOUDFLARE_WORKER_DOMAIN and CLW_TARGET_DOMAINS removed
      EPG_URL: "https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and set up Python virtual environment
        # Note: Playwright is installed but its usage is not evident in the remaining script logic.
        run: |
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 aiohttp dropbox httpx requests
        shell: bash

      - name: Download scripts and clean line endings
        run: |
          curl -L -o FS.py "https://tinyurl.com/mv5ew6m5"
          curl -L -o PP.py "https://tinyurl.com/muuurv94"
          curl -L -o TML.py "https://tinyurl.com/mrmtxffk"
          curl -L -o WC.py "https://tinyurl.com/35jt8wtm"
          curl -L -o STB.py "https://tinyurl.com/37yajm8v"
          curl -L -o OVG.py "https://tinyurl.com/r5re7n5t"
          curl -L -o ACEE.py "https://tinyurl.com/45yxvmmn"
          curl -L -o FILTER.py "https://tinyurl.com/8x4hkrvy"
          curl -L -o PPL_SCRIPT.py "https://tinyurl.com/muuurv94"
          curl -L -o channels.txt "https://tinyurl.com/4ze5nm6p"

          if [ -f "channels.txt" ]; then
            mv channels.txt channels.txt.tmp
            tr -d '\r' < channels.txt.tmp > channels.txt
            rm channels.txt.tmp
            echo "✅ Cleaned channels.txt for invisible line-ending characters."
          fi
        shell: bash

      - name: Download remote pl
        run: |
          echo "Starting download of remote playlists from channels.txt..."
          if [ -f "channels.txt" ]; then
            line_number=0
            while read -r url; do
              line_number=$((line_number + 1))
              if [[ ! -z "$url" && ! "$url" =~ ^# ]]; then
                temp_file="remote_playlist_${line_number}.m3u"
                echo "Downloading line ${line_number}: $url to $temp_file"
                if curl -L -f --connect-timeout 15 "$url" -o "$temp_file"; then
                  echo "✅ Successfully downloaded: $url"
                else
                  echo "❌ Failed to download: $url"
                  echo "#EXTM3U" > "$temp_file"
                  echo "#ERROR_DOWNLOAD_FAILED $url" >> "$temp_file"
                fi
              fi
            done < "channels.txt"
          else
            echo "⚠️ channels.txt not found, skipping remote playlist download."
          fi
        shell: bash

      - name: Download Remote FSC.m3u with Backup Links
        run: |
          FSC_MAIN_URL="https://bit.ly/FSCChannelsm3u"
          FSC_BACKUP_URL="https://bit.ly/3Wmleuo"
          OUTPUT_FILE="remote_FSC.m3u"
          
          echo "Attempting to download FSC.m3u from main link..."
          if curl -L -f --connect-timeout 15 "$FSC_MAIN_URL" -o "$OUTPUT_FILE"; then
              echo "✅ Successfully downloaded FSC.m3u from main link."
          else
            echo "❌ Main link failed. Attempting backup link..."
            if curl -L -f --connect-timeout 15 "$FSC_BACKUP_URL" -o "$OUTPUT_FILE"; then
                echo "✅ Successfully downloaded FSC.m3u from backup link."
            else
              echo "❌ Both FSC links failed. Creating empty placeholder file."
              echo "#EXTM3U" > "$OUTPUT_FILE"
              echo "#ERROR_FSC_DOWNLOAD_FAILED" >> "$OUTPUT_FILE"
            fi
          fi
        shell: bash
        
      - name: Run Python scripts and Measure Time ⏱️
        run: |
          source venv/bin/activate
          
          # Initialize the main playlist file
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > MyStuff.m3u
          
          S3_TEMP_FILE="S3_UNTOUCHED_TEMP.m3u"
          REMOTE_UNTOUCHED_TEMP="REMOTE_UNTOUCHED_TEMP.m3u"
          echo "" > "$S3_TEMP_FILE"
          echo "" > "$REMOTE_UNTOUCHED_TEMP"
          
          declare -A script_outputs
          script_outputs=(
            ["FS.py"]="S2.m3u8"
            ["PPL_SCRIPT.py"]="S3.m3u"
            ["TML.py"]="S4.m3u8"
            ["WC.py"]="S5.m3u8"
            ["STB.py"]="S6.m3u8"
            ["OVG.py"]="S7.m3u8"
            ["ACEE.py"]="ACEE.m3u8"
            ["FILTER.py"]="S_FILTER.m3u"
          )
          
          TOTAL_SCRIPTS=${#script_outputs[@]}
          SCRIPTS_COMPLETED=0
          
          echo "--- Combining content from Python scripts ---"
          for script in "${!script_outputs[@]}"; do
            SCRIPTS_COMPLETED=$((SCRIPTS_COMPLETED + 1))
            
            echo -e "\n\n\033[1;44m --- SCRIPT PROGRESS: ${SCRIPTS_COMPLETED} of ${TOTAL_SCRIPTS} --- \033[0m"
            
            START_TIME=$(date +%s)
            echo "::group::▶️ Running $script..."
            python "$script" || echo "⚠️ $script failed but continuing..."
            echo "::endgroup::"
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            
            echo "::notice title=Script Complete::**✅ $script FINISHED!** Time Taken: **${DURATION}s**"
            
            output_file="${script_outputs[$script]}"
            
            if [ -s "$output_file" ]; then
              if [ "$script" == "PPL_SCRIPT.py" ]; then
                echo "📄 Storing untouched S3.m3u content..."
                cat "$output_file" > "$S3_TEMP_FILE"
              else
                echo "📄 Appending from $output_file to MyStuff.m3u"
                for i in {1..10}; do echo >> MyStuff.m3u; done
                grep -v '^#EXTM3U' "$output_file" >> MyStuff.m3u || true
              fi
              rm -f "$output_file"
            else
              echo "⚠️ $output_file empty or missing, skipping."
            fi
          done

          echo "--- Appending FSC.m3u (normal append with cleanup) ---"
          FSC_FILE="remote_FSC.m3u"
          if [ -s "$FSC_FILE" ] && ! grep -q "#ERROR_FSC_DOWNLOAD_FAILED" "$FSC_FILE"; then
              echo "📄 Appending FSC.m3u to MyStuff.m3u"
              for i in {1..10}; do echo >> MyStuff.m3u; done
              grep -v '^#EXTM3U' "$FSC_FILE" >> MyStuff.m3u || true
          else
            echo "⚠️ FSC.m3u download failed or empty."
          fi

          echo "--- Collecting untouched remote playlists from channels.txt ---"
          downloaded_files=$(find . -maxdepth 1 -type f -name 'remote_playlist_*.m3u' | sort -V)
          if [ -n "$downloaded_files" ]; then
            for temp_file in $downloaded_files; do
              if grep -q "#ERROR_DOWNLOAD_FAILED" "$temp_file"; then
                echo "⚠️ Skipping failed: $(basename "$temp_file")"
              else
                echo "📄 Storing $(basename "$temp_file") untouched..."
                for i in {1..5}; do echo >> "$REMOTE_UNTOUCHED_TEMP"; done
                cat "$temp_file" >> "$REMOTE_UNTOUCHED_TEMP"
              fi
              rm -f "$temp_file"
            done
          else
            echo "⚠️ No remote playlists found."
          fi
        shell: bash

      # Process and Create CLW step removed
      # Formatting step removed
        
      - name: Final Append S3.m3u (Unchanged) 🌟
        run: |
          S3_TEMP_FILE="S3_UNTOUCHED_TEMP.m3u"
          if [ -s "$S3_TEMP_FILE" ]; then
              echo "--- Appending 100% UNCHANGED S3.m3u content to MyStuff.m3u. ---"
              for i in {1..10}; do echo >> MyStuff.m3u; done
              cat "$S3_TEMP_FILE" >> MyStuff.m3u
              rm -f "$S3_TEMP_FILE"
          else
              echo "⚠️ S3_UNTOUCHED_TEMP.m3u missing or empty."
          fi
        shell: bash

      - name: Append Unchanged Remote URLs 🌍
        run: |
          REMOTE_UNTOUCHED_TEMP="REMOTE_UNTOUCHED_TEMP.m3u"
          if [ -s "$REMOTE_UNTOUCHED_TEMP" ]; then
              echo "--- Appending 100% UNCHANGED remote URLs to MyStuff.m3u. ---"
              for i in {1..10}; do echo >> MyStuff.m3u; done
              cat "$REMOTE_UNTOUCHED_TEMP" >> MyStuff.m3u
              rm -f "$REMOTE_UNTOUCHED_TEMP"
          else
              echo "⚠️ No untouched remote URLs found."
          fi
        shell: bash

      - name: Final Playlist Cleanup
        run: |
          echo "Cleaning trailing spaces and empty lines in MyStuff.m3u..."
          tr -d '\r' < MyStuff.m3u > MyStuff_TEMP1.m3u
          sed -E 's/[[:space:]]+$//' MyStuff_TEMP1.m3u > MyStuff_TEMP2.m3u
          grep -v '^$' MyStuff_TEMP2.m3u > MyStuff.m3u
          rm -f MyStuff_TEMP1.m3u MyStuff_TEMP2.m3u
          echo "✅ Final formatting done on MyStuff.m3u."
        shell: bash
      
      - name: Upload original
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuff.m3u
          DEST_PATH: /MyStuff/MyStuff.m3u

      - name: Upload Duplicate for MyStuffCLW path
        # Uploads the *same* MyStuff.m3u file to the second Dropbox path
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuff.m3u
          DEST_PATH: /MyStuff/MyStuffCLW.m3u # Target path of the old CLW file
