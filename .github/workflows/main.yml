name: Combined Remote Playlist

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install httpx[http2] aiohttp h2 dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4 playwright

      - name: Install Playwright Browsers
        shell: bash
        run: |
          playwright install firefox chromium chrome
          playwright install-deps firefox chromium chrome

      - name: Run Scraper (TMS/TMLN)
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running TimStreams (TMLMAIN) ---"
          rm -rf TML/* && mkdir -p TML
          curl -L -f -o TMLMAIN.py "${{ secrets.TMLMAIN_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u TMLMAIN.py || echo "⚠️ TMLMAIN failed..."
          sync

      - name: Run DAMIPPV Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running DAMIPPV Scraper ---"
          curl -L -f -o DAMIPPV.py "${{ secrets.DAMIPPV_URL }}"
          python3 -u DAMIPPV.py || echo "⚠️ DAMIPPV failed..."
          sync

      - name: Run DAMI Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running DAMI Scraper ---"
          curl -L -f -o DAMI.py "${{ secrets.DAMI_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u DAMI.py || echo "⚠️ DAMI failed..."
          sync

      - name: Run RawGit Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running RawGit Scraper ---"
          curl -L -f -o RawGit_Scraper.py "${{ secrets.RAWGIT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u RawGit_Scraper.py || echo "⚠️ RawGit failed..."
          sync

      - name: Run PTSPT Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running PTSPT Scraper (Strict Live) ---"
          rm -rf ptsp/* && mkdir -p ptsp
          curl -L -f -o PTSPT.py "${{ secrets.PTSPT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u PTSPT.py || echo "⚠️ PTSPT failed..."
          sync

      - name: Run ROX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running ROX Scraper ---"
          rm -rf rox/* && mkdir -p rox
          curl -L -f -o rox_script.py "${{ secrets.ROX_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u rox_script.py || echo "⚠️ ROX failed..."
          sync

      - name: Run SS99 Scrapers
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SS99 Scrapers ---"
          rm -rf SS99/* ss99events/* && mkdir -p SS99 ss99events
          curl -L -f -o SS99_Channels.py "${{ secrets.SS99_CHANNELS_URL }}"
          timeout 600s python3 -u SS99_Channels.py || echo "⚠️ SS99 Channels failed..."
          curl -L -f -o SS99_Events_Scraper.py "${{ secrets.SS99_EVENTS_URL }}"
          timeout 360s python3 -u SS99_Events_Scraper.py || echo "⚠️ SS99 Events failed..."
          sync

      - name: Run SPX Scraper
        shell: bash
        continue-on-error: true
        run: |
          echo "--- Running SPX Scraper ---"
          curl -L -f -o SpX.py "${{ secrets.SPX_URL }}"
          timeout 360s python3 -u SpX.py || echo "⚠️ SPX failed..."
          sync

      - name: Process and Merge All Playlists
        shell: bash
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"

          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          
          # Merge local M3U files including PPVss.m3u and DAMiltered.m3u
          for f in "tms1.m3u" "PPVss.m3u" "DAMiltered.m3u" "RawGit.m3u" "pitspt.m3u" "rox.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "spx.m3u"; do
            if [ -s "$f" ]; then
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          # Process Remote Lists from tinyurl
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            if curl -L -f -k --connect-timeout 15 "$url" -o "$temp" -s; then
                echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
                sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < <(tr -d '\r' < channels.txt)

      - name: Final Cleanup
        shell: bash
        run: |
          sed -i 's/\r//g' MyStuffCLW.m3u
          sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u

      - name: Deploy Script Folders to GitHub
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git reset --soft origin/main
          
          # Only add folders containing logic/manifests, not the playlist files or PPV logic
          git add SS99/ ss99events/ rox/ ptsp/ TML/
          
          git commit -m "Update Script Data & TML Mirrors: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)

      - name: Upload Main Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          dest_path: /MyStuff/MyStuffCLW.m3u

      - name: Upload PPVss Backup to Dropbox
        if: hashFiles('PPVss.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: PPVss.m3u
          dest_path: /MyStuff/PPVss.m3u

      - name: Upload DAMI Backup to Dropbox
        if: hashFiles('DAMiltered.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: DAMiltered.m3u
          dest_path: /MyStuff/DAMiltered.m3u

      - name: Upload TMS Backup to Dropbox
        if: hashFiles('tms1.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: tms1.m3u
          dest_path: /MyStuff/tms1.m3u

      - name: Upload PTSPT Backup to Dropbox
        if: hashFiles('pitspt.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: pitspt.m3u
          dest_path: /MyStuff/pitspt.m3u

      - name: Upload ROX Backup to Dropbox
        if: hashFiles('rox.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: rox.m3u
          dest_path: /MyStuff/rox.m3u

      - name: Upload SS99 Backup to Dropbox
        if: hashFiles('SSpo99.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SSpo99.m3u8
          dest_path: /MyStuff/SSpo99.m3u8

      - name: Upload SS99 Events Backup to Dropbox
        if: hashFiles('SS99_Events.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SS99_Events.m3u8
          dest_path: /MyStuff/SS99_Events.m3u8

      - name: Upload SPX Backup to Dropbox
        if: hashFiles('spx.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: spx.m3u
          dest_path: /MyStuff/spx.m3u
          
      - name: Upload RawGit Backup to Dropbox
        if: hashFiles('RawGit.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: RawGit.m3u
          dest_path: /MyStuff/RawGit.m3u
