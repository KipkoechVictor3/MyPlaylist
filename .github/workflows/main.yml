name: Combined Remote Playlist

on:
  schedule:
    # 7:00 AM to 11:30 PM (GMT+3) -> 4:00 AM to 8:30 PM (UTC)
    - cron: '0,30 4-20 * * *'
  workflow_dispatch:

concurrency:
  group: combined-processing
  cancel-in-progress: true

jobs:
  update-all-playlists:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      DOCKER_CONFIG: /tmp
      HTTP_KEEP_ALIVE: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl git
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install playwright==1.55.0 httpx[http2] aiohttp dropbox requests pycryptodome python-dateutil tqdm beautifulsoup4
          playwright install firefox
        shell: bash

      - name: Run TMLMain Scraper
        run: |
          source venv/bin/activate
          curl -L -o TMLMain.py "https://www.dropbox.com/scl/fi/3lhquuxhvtbwpo3pzi99d/TMLMain.py?rlkey=zpiwgjs8tsgm9b2r116o43dui&st=8yzkpwst&dl=1"
          python TMLMain.py || echo "⚠️ TMLMain failed"
          sync
        shell: bash

      - name: Run CATFT Scraper
        run: |
          source venv/bin/activate
          curl -L -o CATFt.py "https://www.dropbox.com/scl/fi/wf74ev50wjskahwifmzcp/CATFt.py?rlkey=yl569ajzo11dgnblpwf6wd11i&st=7fes2iic&dl=1"
          python CATFt.py || (sleep 10 && python CATFt.py) || echo "⚠️ CATFT failed"
          sync
        shell: bash

      - name: Run SS99 Scrapers (With Retries)
        run: |
          source venv/bin/activate
          echo "--- Running SS99 Channels ---"
          curl -L -o SS99_Channels.py "https://www.dropbox.com/scl/fi/o0mxw7v6gfm9eftonscuy/str99.py?rlkey=ehs3jfw6kdig0hgp4a8fb2fit&st=38etoi0k&dl=1"
          timeout 500s python SS99_Channels.py || (sleep 15 && python SS99_Channels.py) || echo "⚠️ SS99 Channels partial completion"
          
          sync && sleep 5
          
          echo "--- Running SS99 Events ---"
          curl -L -o SS99_Events_Scraper.py "https://www.dropbox.com/scl/fi/yuer1q6mc15ri2ifbobqf/ss99Events.py?rlkey=x599l0jqwm4dt3vvvk56vk3s8&st=5o1ux1zx&dl=1"
          timeout 500s python SS99_Events_Scraper.py || (sleep 20 && python SS99_Events_Scraper.py) || echo "⚠️ SS99 Events partial completion"
          sync
        shell: bash

      - name: Run SPX Scraper
        run: |
          source venv/bin/activate
          curl -L -o SpX.py "https://www.dropbox.com/scl/fi/mec73is6zoc705tkbyjs2/SpX.py?rlkey=6xjaco9csn51zft4bvtqzv0y0&st=vwbo3jw8&dl=1"
          python -u SpX.py || echo "⚠️ SPX Script failed."
          sync
        shell: bash

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          EPG_URL="https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"
          
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          
          echo "--- Merging Local Scraper Results ---"
          # Added S4.m3u8 (TML) to the merge loop
          for f in "Combined_Sports.m3u" "spx.m3u" "SSpo99.m3u8" "SS99_Events.m3u8" "S4.m3u8"; do
            if [ -s "$f" ]; then
              echo "✅ Merging $f..."
              echo -e "\n######## SOURCE: ${f%.*} ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$f" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
          done

          echo -e "\n--- Merging Remote Playlists ---"
          curl -L -s -o channels.txt "https://tinyurl.com/4ze5nm6p"
          tr -d '\r' < channels.txt > channels_clean.txt
          
          while read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            temp="remote_t.m3u"
            STATUS=$(curl -L -f -k --connect-timeout 10 --max-time 25 "$url" -o "$temp" -s -w "%{http_code}")
            
            if [ "$STATUS" -eq 200 ] && [ -s "$temp" ]; then
              echo -e "\n######## REMOTE: $url ########" >> "$OUTPUT_FILE"
              sed 's/\r$//' "$temp" | grep -v '^#EXTM3U' >> "$OUTPUT_FILE"
            fi
            rm -f "$temp"
          done < "channels_clean.txt"
          set -e
        shell: bash

      - name: Final Cleanup and Stats
        run: |
          sed -i 's/\r//g' MyStuffCLW.m3u
          sed -i '/^[[:space:]]*$/d' MyStuffCLW.m3u
          echo "🚀 Master Playlist Finalized. Total Lines: $(wc -l < MyStuffCLW.m3u)"
        shell: bash

      - name: Upload Master Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          DEST_PATH: /MyStuff/MyStuffCLW.m3u

      - name: Upload TML S4 (Primary)
        if: hashFiles('S4.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S4.m3u8
          DEST_PATH: /MyStuff/S4.m3u8

      - name: Upload TML S4 (Backup)
        if: hashFiles('S4.m3u8') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: S4.m3u8
          DEST_PATH: /MyStuff/Backups/S4_backup.m3u8

      - name: Upload CATFT Standalone
        if: hashFiles('Combined_Sports.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: Combined_Sports.m3u
          DEST_PATH: /MyStuff/Combined_Sports.m3u

      - name: Upload SPX Standalone
        if: hashFiles('spx.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: spx.m3u
          DEST_PATH: /MyStuff/spx.m3u
