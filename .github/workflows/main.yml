name: Combined Remote Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
      EPG_URL: "https://raw.githubusercontent.com/KipkoechVictor3/MyEPG/main/combined_epg.xml.gz"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0 requests
          python -m playwright install firefox
        shell: bash

      - name: Fetch Remote Channels List
        run: |
          curl -L -o channels.txt "https://tinyurl.com/4ze5nm6p"
          tr -d '\r' < channels.txt > channels_clean.txt
          mv channels_clean.txt channels.txt
        shell: bash

      - name: Run SS99 Scrapers (Channels & Events)
        run: |
          source venv/bin/activate
          
          echo "--- Running SS99 Channels Scraper ---"
          curl -L -o SS99_Channels.py "https://www.dropbox.com/scl/fi/o0mxw7v6gfm9eftonscuy/str99.py?rlkey=ehs3jfw6kdig0hgp4a8fb2fit&st=38etoi0k&dl=1"
          python SS99_Channels.py
          
          echo "--- Running SS99 Events Scraper ---"
          curl -L -o SS99_Events_Scraper.py "https://www.dropbox.com/scl/fi/yuer1q6mc15ri2ifbobqf/ss99Events.py?rlkey=x599l0jqwm4dt3vvvk56vk3s8&st=5o1ux1zx&dl=1"
          python SS99_Events_Scraper.py
        shell: bash

      - name: Process and Merge All Playlists
        run: |
          set +e 
          OUTPUT_FILE="MyStuffCLW.m3u"
          echo "#EXTM3U url-tvg=\"${EPG_URL}\"" > "$OUTPUT_FILE"
          
          echo "--- Merging Scraped SS99 Content ---"
          # Merge Channels
          if [ -s "SSpo99.m3u8" ]; then
            echo -e "\n######## SOURCE: SS99 CHANNELS ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' SSpo99.m3u8 >> "$OUTPUT_FILE"
            echo "✅ Merged SS99 Channels"
          fi
          
          # Merge Events
          if [ -s "SS99_Events.m3u8" ]; then
            echo -e "\n######## SOURCE: SS99 EVENTS ########" >> "$OUTPUT_FILE"
            grep -v '^#EXTM3U' SS99_Events.m3u8 >> "$OUTPUT_FILE"
            echo "✅ Merged SS99 Events"
          fi

          echo "--- Downloading and Merging Remote Playlists ---"
          if [ -f "channels.txt" ]; then
            while read -r url || [ -n "$url" ]; do
              [[ -z "$url" || "$url" =~ ^# ]] && continue
              
              FRIENDLY_NAME=$(echo "$url" | awk -F'/' '{print $NF}' | cut -d'?' -f1 | sed 's/\.m3u8//g; s/\.m3u//g')
              [ -z "$FRIENDLY_NAME" ] && FRIENDLY_NAME="Remote_Stream"

              temp_file="temp_dl.m3u"
              echo "Downloading: $FRIENDLY_NAME"
              curl -L -f -k -s -4 \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                --connect-timeout 15 \
                --retry 2 \
                "$url" -o "$temp_file"
              
              if [ -s "$temp_file" ] && grep -qE '^(#EXTM3U|#EXTINF)' "$temp_file"; then
                echo -e "\n######## SOURCE: $FRIENDLY_NAME ########" >> "$OUTPUT_FILE"
                grep -v '^#EXTM3U' "$temp_file" >> "$OUTPUT_FILE"
                echo "✅ Merged $FRIENDLY_NAME"
              fi
              rm -f "$temp_file"
            done < "channels.txt"
          fi
          set -e
        shell: bash

      - name: Clean and Finalize Playlist
        run: |
          tr -d '\r' < MyStuffCLW.m3u > final_temp.m3u
          sed -E 's/[[:space:]]+$//' final_temp.m3u | grep -v '^[[:space:]]*$' | tr -s '\n' > MyStuffCLW.m3u
          rm final_temp.m3u
          echo "✅ Final cleanup complete. Total Lines: $(wc -l < MyStuffCLW.m3u)"
        shell: bash

      - name: Upload Master Playlist to Dropbox
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: MyStuffCLW.m3u
          DEST_PATH: /MyStuff/MyStuffCLW.m3u

      - name: Upload Individual SS99 Playlists (Optional Backup)
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: SSpo99.m3u8
          DEST_PATH: /MyStuff/SSpo99.m3u8
