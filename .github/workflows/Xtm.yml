name: Generate IPTV Playlist and Upload to Dropbox

on:
  # Allows you to run this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    container:
      # Using a standard Python image for reliability
      image: python:3-alpine
      # FIX: Must explicitly set the container user to root for the checkout action to work
      options: --user root

    steps:
      - name: ⬇️ Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Install Required Tools (curl & bash)
        # Install necessary tools not included in the base Python Alpine image
        run: |
          apk update
          apk add curl bash

      - name: 📝 Generate M3U Playlist (Direct Download)
        id: generate_m3u
        shell: bash
        run: |
          # --- Configuration ---
          # Use your direct M3U link with credentials
          PLAYLIST_URL="http://xxip25.top:8080/get.php?username=95621707&password=63396105&type=m3u_plus"
          OUTPUT_FILE="iptv_playlist.m3u"
          
          echo "-> Attempting to download playlist from ${PLAYLIST_URL}"
          
          # Use curl to download the file, failing if the server returns an error code
          curl -s --fail -o "${OUTPUT_FILE}" "${PLAYLIST_URL}"
          
          CURL_STATUS=$?
          
          # Check for curl success and then verify content for non-empty playlist
          if [ $CURL_STATUS -eq 0 ] && grep -q "#EXTINF" "${OUTPUT_FILE}"; then
            echo "-> ✅ Success! Playlist downloaded and verified."
          elif [ $CURL_STATUS -ne 0 ]; then
            echo "::error::Curl failed to download the playlist. Server request status: ${CURL_STATUS}"
            exit 1
          else
            echo "::error::Playlist downloaded, but appears empty (no #EXTINF markers). Did not save."
            exit 1
          fi

      - name: 📤 Upload Playlist to Dropbox
        # The Dropbox action you requested
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          # These must be set as Secrets in your GitHub repository
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: iptv_playlist.m3u
          DEST_PATH: /MyPlaylists/iptv_playlist.m3u
