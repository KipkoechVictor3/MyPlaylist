name: PPV Scraper

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  workflow_dispatch:

jobs:
  scrape-ppv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added [http2] for webwork.py requirement
          pip install "httpx[http2]" playwright pytz
          # Installing Firefox for hdl_brwsr and Chromium for xtrnl_brwsr
          python -m playwright install firefox chromium 

      - name: Launch Background Browser (CDP)
        run: |
          # Added flags for stability in headless Linux and silenced stderr
          google-chrome --headless --remote-debugging-port=9222 --disable-gpu --no-sandbox --disable-dev-shm-usage > /dev/null 2>&1 &
          sleep 5

      - name: Run Scraper
        run: python fetch.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update PPV Playlist"
          # Using "." prevents the 'pathspec did not match' error 
          # by letting Git find whatever files were actually created.
          file_pattern: "."
          skip_dirty_check: false
