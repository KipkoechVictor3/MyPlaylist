name: FS Playlist Updater

on:
  workflow_dispatch:
  schedule:
    # Run every 35 minutes
    - cron: '*/35 * * * *'

jobs:
  update-fs-playlist:
    runs-on: ubuntu-latest
    # Ensure Playwright image is compatible with Firefox (which it is)
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          # Installing playwright, httpx, aiohttp, dropbox, requests as before
          pip install playwright==1.55.0 httpx aiohttp dropbox requests
          # playwright install firefox is correct for your browser preference
          playwright install firefox
        shell: bash

      - name: Download FSC Scraper
        # The script provided in the question is assumed to be FSC.py
        run: |
          echo "📥 Downloading FSC script..."
          # Replace with the actual URL for FSC.py, using the one you provided in the prompt
          curl -L -o FSC.py "https://tinyurl.com/mv5ew6m5"
        shell: bash

      - name: Run FSC Scraper
        run: |
          source venv/bin/activate
          echo "🚀 Running FSC scraper..."
          # Running the new script name
          python FSC.py || echo "⚠️ FSC scraper failed but continuing..."
        shell: bash

      - name: Rename Output to FS.m3u
        run: |
          # Your script configuration specifies OUTPUT_FILE = "S2.m3u8"
          if [ -f "S2.m3u8" ]; then
            mv S2.m3u8 FS.m3u
            echo "✅ Renamed S2.m3u8 → FS.m3u"
          else
            echo "⚠️ No S2.m3u8 found; creating empty FS.m3u."
            echo "#EXTM3U" > FS.m3u
          fi
        shell: bash

      - name: Upload FS Playlist to Dropbox
        # Note: I renamed the source_path and DEST_PATH to match the FS script's output
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: FS.m3u
          DEST_PATH: /MyStuff/FS.m3u
