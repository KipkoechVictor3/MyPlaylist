name: Scraper Script MeaU

on:
  # Runs every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  # Allow manual runs too
  workflow_dispatch:

jobs:
  run-media4u-script:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies (requests, tqdm)..."
          apt-get update
          apt-get install -y python3-venv curl
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests tqdm
        shell: bash

      - name: Download Media4u Scraper script
        run: |
          echo "📥 Downloading Meau.py from Dropbox..."
          curl -L -o Meau.py "https://www.dropbox.com/scl/fi/v5nhpz243jcka7xh0818v/Meau.py?rlkey=tjkbjyrb60qvzrujd9pdygzhp&st=fx6hw6sr&dl=1"
        shell: bash

      - name: Run Scraper and Verify Both Output Files ⏱️
        run: |
          source venv/bin/activate
          
          echo "::group::▶️ Running Meau.py..."
          START_TIME=$(date +%s)
          python Meau.py
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "::endgroup::"
          echo "::notice title=Script Time Complete::**✅ Meau.py FINISHED!** Time Taken: **${DURATION} seconds**"

          # 🚨 CRITICAL CHECK 1: Verify Mediauu.m3u
          if [ -f "Mediauu.m3u" ]; then
              echo "✅ Output file **Mediauu.m3u** found."
          else
              echo "❌ Expected output file **Mediauu.m3u** not found."
              exit 1 # Fail the step
          fi
          
          # 🚨 CRITICAL CHECK 2: Verify full_groups_list.txt
          if [ -f "full_groups_list.txt" ]; then
              echo "✅ Output file **full_groups_list.txt** found."
          else
              echo "❌ Expected output file **full_groups_list.txt** not found."
              exit 1 # Fail the step
          fi

          # 🚨 DIAGNOSTIC CHECK: List directory contents
          echo "### Output Files Check ###"
          ls -l Mediauu.m3u full_groups_list.txt
        shell: bash

      - name: Upload Mediauu.m3u to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: Mediauu.m3u
          DEST_PATH: /MyStuff/Mediauu.m3u
          
      - name: Upload full_groups_list.txt to Dropbox ⬆️
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: full_groups_list.txt
          DEST_PATH: /MyStuff/full_groups_list.txt
