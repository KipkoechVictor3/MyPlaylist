name: FreshT Deployment Workflow

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write
  workflows: write  # Necessary to bypass the remote rejection you saw

concurrency:
  group: fresht-processing
  cancel-in-progress: true

jobs:
  update-fresht:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run FreshT Scraper
        continue-on-error: true
        run: |
          echo "--- Running FreshT Scraper ---"
          mkdir -p FRESHT
          curl -L -f -o FRESHT_Scraper.py "${{ secrets.FRESHT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u FRESHT_Scraper.py
          sync

      - name: Push Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes to avoid conflict
          git pull origin main --rebase
          
          # Stage ONLY the FRESHT folder
          git add FRESHT/
          
          # Check if there are actually changes before committing
          if git diff --staged --quiet; then
            echo "No changes in FRESHT files. Skipping push."
          else
            git commit -m "Update FRESHT Data: $(date +'%Y-%m-%d %H:%M')"
            # Standard push; permissions: workflows: write handles the security check
            git push origin main
          fi

      - name: Upload Main Playlist to Dropbox
        if: hashFiles('fsht.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: fsht.m3u
          dest_path: /MyStuff/fsht.m3u
