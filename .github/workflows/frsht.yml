name: FreshT Deployment Workflow

on:
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

concurrency:
  group: fresht-processing
  cancel-in-progress: true

jobs:
  update-fresht:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run FreshT Scraper
        continue-on-error: true
        run: |
          echo "--- Running FreshT Scraper ---"
          mkdir -p FRESHT
          curl -L -f -o FRESHT_Scraper.py "${{ secrets.FRESHT_URL }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u FRESHT_Scraper.py
          sync

      - name: Final Cleanup
        run: |
          if [ -f "fsht.m3u" ]; then
            sed -i 's/\r//g' fsht.m3u
            sed -i '/^[[:space:]]*$/d' fsht.m3u
          fi

      - name: Deploy FreshT to GitHub
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git reset --soft origin/main
          
          # Using your preferred targeted add approach
          git add FRESHT/
          
          git commit -m "Update FRESHT individual links: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)

      - name: Upload Main Playlist to Dropbox
        if: hashFiles('fsht.m3u') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: fsht.m3u
          dest_path: /MyStuff/fsht.m3u
