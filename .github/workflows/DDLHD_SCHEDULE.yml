name: DDLHD

on:
  schedule:
    - cron: '40 */1 * * *' # Every 1 hour 40 minutes
  workflow_dispatch:

jobs:
  run-ddlhd-script:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb curl git

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Download DDLHD Script
        run: |
          curl -L -f -o MAgroup.py "${{ secrets.DADDYLIVE_SCHEDULE_URL }}"
        shell: bash

      - name: Run Scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python3 -u MAgroup.py
        shell: bash

      - name: Upload Schedule JSON to Dropbox
        if: hashFiles('daddyliveSchedule.json') != ''
        uses: gomes042/gh-actions-dropbox/files/upload@23ce81287e83f01c19c9f60b1849b746db6616b5
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          source_path: "daddyliveSchedule.json"
          dest_path: "/MyStuff/daddyliveSchedule.json"
